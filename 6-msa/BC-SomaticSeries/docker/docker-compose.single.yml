services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: somatic_series
    ports:
      - "5432:5432"
    volumes:
      - somatic-series-pgdata:/var/lib/postgresql/data

  somatic-series:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Single
      ConnectionStrings__SomaticSeriesDb: "Host=postgres;Port=5432;Database=somatic_series;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  somatic-series-pgdata:
