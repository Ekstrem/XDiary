services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: journal
    ports:
      - "5432:5432"
    volumes:
      - journal-pgdata:/var/lib/postgresql/data

  journal:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Single
      ConnectionStrings__JournalDb: "Host=postgres;Port=5432;Database=journal;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  journal-pgdata:
