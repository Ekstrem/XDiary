services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: partners
    ports:
      - "5432:5432"
    volumes:
      - partners-pgdata:/var/lib/postgresql/data

  partners:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Single
      ConnectionStrings__PartnersDb: "Host=postgres;Port=5432;Database=partners;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  partners-pgdata:
