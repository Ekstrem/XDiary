services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: apple_health_gateway
    ports:
      - "5432:5432"
    volumes:
      - apple-health-gateway-pgdata:/var/lib/postgresql/data

  apple-health-gateway:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Single
      ConnectionStrings__AppleHealthGatewayDb: "Host=postgres;Port=5432;Database=apple_health_gateway;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  apple-health-gateway-pgdata:
