services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portability
    ports:
      - "5432:5432"
    volumes:
      - portability-pgdata:/var/lib/postgresql/data

  portability:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Single
      ConnectionStrings__PortabilityDb: "Host=postgres;Port=5432;Database=portability;Username=postgres;Password=postgres"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

volumes:
  portability-pgdata:
