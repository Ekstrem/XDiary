garmin-gateway       single-1d8b9b3     6-msa/BC-GarminGateway  commit=1d8b9b3
apple-health-gateway single-1d8b9b3     6-msa/BC-AppleHealthGateway  commit=1d8b9b3
analytics            single-1d8b9b3     6-msa/BC-Analytics  commit=1d8b9b3
privacy              single-1d8b9b3     6-msa/BC-Privacy  commit=1d8b9b3
