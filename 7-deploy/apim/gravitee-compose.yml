# APIM: Gravitee CE, С 2026-11-05 В ПУТИ ТРАФИКА (DO-076).
#
# ВНИМАНИЕ: этот заголовок раньше утверждал обратное — «control plane, ВНЕ пути
# запросов; падение APIM не влияет на продукт». Это устарело и было неверно:
# публичный вход прода с 2026-11-05 идёт `Funnel → Caddy:8081 → APIM:18082 → сервисы`.
# Следствия, которые надо держать в голове:
#   * **gateway упал ⇒ публичный API недоступен** (404/502 на `/api/v1/*`); это уже
#     единая точка отказа, а не «безопасный control plane»;
#   * `/health` идёт МИМО APIM (в APIM нет маршрута `/health` → 404), поэтому проверка
#     только `/health` мёртвый gateway НЕ покажет;
#   * health-гейт стека — `tools/check_apim_health.py` (6 проверок, включая публичный
#     путь через Caddy и наличие `X-Gravitee-*`); он же в pre-flight `deploy.yml`;
#   * стек пока НЕ сверяется CD-скриптами (`deploy.sh`/`update.sh` не упоминают APIM) —
#     открытый долг `DO-078`.

#
# Лимиты памяти — из замера @DO 05:25 (ES 875 / Mongo 99 / Gateway 489 / Management 496 МБ).
# Elasticsearch в этап 1 НЕ входит: для маршрутизации он не нужен, а это +875 МБ.
#
# Запуск (rootless podman на VPS-1):
#   cd /opt/xdiary/7-deploy/apim && podman-compose -f gravitee-compose.yml up -d
name: xdiary-apim

services:
  mongo:
    image: docker.io/library/mongo:6
    container_name: xdiary-apim-mongo
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 512m
    restart: unless-stopped
    volumes:
      - apim-mongo-data:/data/db
    networks: [apim]

  management-api:
    image: docker.io/graviteeio/apim-management-api:4.4
    container_name: xdiary-apim-management
    # 768 МБ, а не 512: на 512 RSS упирался в потолок (511/536) и контейнер выходил;
    # ручной пробник на 768 МБ поднялся и дошёл до инициализаторов (проверено 17:20).
    mem_limit: 768m
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      gravitee_management_mongodb_uri: mongodb://xdiary-apim-mongo:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
      gravitee_analytics_type: none
      gravitee_reporters_elasticsearch_enabled: "false"
      gravitee_services_core_http_port: "8073"   # node-management, НЕ 8083 (там HTTP API)
    # порт НЕ публикуем ВООБЩЕ: проверка — через `podman exec` (rootlessport изредка
    # роняет контейнер при старте; для control plane внешний порт не нужен)
    networks: [apim]

  gateway:
    image: docker.io/graviteeio/apim-gateway:4.4
    container_name: xdiary-apim-gateway
    mem_limit: 512m
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      gravitee_management_mongodb_uri: mongodb://xdiary-apim-mongo:27017/gravitee?serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
      gravitee_analytics_type: none
      gravitee_reporters_elasticsearch_enabled: "false"
      gravitee_services_core_http_port: "8072"   # node-management, НЕ 8082 (там прокси)
      gravitee_http_port: "8082"                  # прокси-слушатель gateway
    ports:
      - "127.0.0.1:18082:8082"
    networks: [apim]

volumes:
  apim-mongo-data:

networks:
  apim:
    # ВАЖНО: сеть создаётся `podman network create apim` (up.sh), а не podman-compose.
    # Сгенерированный compose CNI-конфиг содержит plugin firewall v1.0.0, который
    # podman 3.4 не понимает → контейнеры создаются (Created), но не стартуют.
    external: true
