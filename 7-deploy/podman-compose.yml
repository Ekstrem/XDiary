# XDiary — VPS-1 (podman rootless)
# 10 микросервисов + API Gateway (YARP), профиль Single.
# Образы собирает CI и публикует в GHCR (ghcr.io/ekstrem/xdiary-*:single).
# Секреты и строки подключения — в secrets/.env (gitignored, chmod 600).
#
# Применение (от пользователя deploy на VPS-1, из /opt/xdiary/7-deploy):
#   podman compose -f podman-compose.yml up -d
#   # или: podman-compose -f podman-compose.yml up -d
#
# Порт 8080 шлюза публикуем только на loopback — наружу его проксирует
# caddy/nginx на 443 (TLS). Сервисы наружу порты не публикуют (только шлюз).
#
# read_only: true + tmpfs /tmp — hardening (DO-005). Если какой-то сервис упадёт
# с ошибкой записи (например, DataProtection/временные файлы), для него можно
# убрать read_only/tmpfs или добавить writable-том под его каталог.

services:
  api-gateway:
    image: ghcr.io/ekstrem/xdiary-api-gateway:single
    env_file: secrets/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Single
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 256m
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  journal:
    image: ghcr.io/ekstrem/xdiary-journal:single
    env_file: secrets/.env
    environment: { ASPNETCORE_ENVIRONMENT: Single }
    mem_limit: 256m
    pids_limit: 512
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped

