# Внешняя сеть с ручным CNI-конфигом v0.4.0 (без plugin firewall):
# podman 3.4.4 генерирует CNI 1.0.0 + firewall, что ломает rootless-сеть
# (см. README «Примечание про podman»). Сеть создаётся вручную:
#   podman network create xdiary  (затем поправить conflist на 0.4.0)
networks:
  default:
    external:
      name: xdiary
