# api-index.yaml — машиночитаемый реестр операций API (ADR-025, AR-016)
# Владелец: @AR (модель и контракт). Сверка индекса с кодом — гейт @DO.
version: 1
status: "draft"  # draft -> complete: все операции покрыты codes, гейт зелёный
source:
  canvases: "03-ddd/BC-*/03-command-api.md, 04-query-api.md (AR-017 §2.2)"
  code: "6-msa/BC-*/**/*Controller.cs (фактические маршруты и operationId = имя действия)"
change_rule: >-
  Новый или изменённый пункт = правка этого файла + гейт в ОДНОМ коммите.
  Гейт сверяет: (1) набор операций индекса == набор в коде; (2) у каждой операции заполнены codes;
  (3) анонимность только по allow-list. Иначе rc=1.
auth_rule: >-
  deny-by-default (ADR-026): анонимны только POST /api/v1/clients, POST /api/v1/clients/{id}/verify,
  POST /api/v1/clients/refresh, POST /api/v1/privacy/verify-token, GET /health.
  Всё остальное требует JWT; без токена -> 401. GET /clients с токеном -> 405 (маршрут удалён, ADR-026).
  GET /health в индексе отсутствует намеренно: это не действие контроллера (даёт фреймворк), гейт исключает его из сверки.
codes_legend: >-
  codes: {код: смысл}. baseline = 200/400/401 по общему правилу; verified = сверено с контрактом/тестами.
