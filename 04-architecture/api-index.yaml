# api-index.yaml — машиночитаемый реестр операций API (ADR-025, AR-016)
# Владелец: @AR (модель и контракт). Сверка индекса с кодом — гейт DO-064 (@DO).
version: 1
status: draft  # draft -> complete по DoD ниже (не «посмотрел», а гейт + пометки)
counts:
  operations: 82
  verified: 39
  derived: 43
  unique_method_path: 82
  unique_operationId: 82
  # пересчитано @AR 2026-11-07 машинно по блокам `- bc:` (было 80/37/43/80/80):
  # 82 блока, из них 39 с `codes_status: verified`, 43 — derived; method+path уникальны 82
  counted_at: "2026-11-10 (пересчёт @AR после правок дня), HEAD с 82 операциями; подтверждено 39 verified / 43 derived, источник — сам файл + check_api_index rc=0; прежнее значение — 2026-11-07 (числа совпали); инварианты статуса проверены 2026-11-10: verified ⇒ ссылка на код (0 нарушений), derived ⇒ без слова «проверено» (0 нарушений), без codes_status — 0"
source:
  canvases: "03-ddd/BC-*/03-command-api.md, 04-query-api.md (AR-017 §2.2)"
  code: "6-msa/BC-*/**/*Controller.cs (фактические маршруты и operationId = имя действия)"
change_rule: >-
  Новый или изменённый пункт = правка этого файла + гейт DO-064 в ОДНОМ коммите. Гейт сверяет: (1) набор операций индекса == набор в коде; (2) у каждой операции заполнены codes; (3) анонимность только по allow-list + internal без токена. Иначе rc=1. Ослабленное/целевое ожидание оформляется по §8 ITERATION-PLAN (owner + условие снятия).
dod_complete: >-
  status: complete ставится только когда: (1) гейт DO-064 зелёный (индекс == код, у всех codes, анонимность = allow-list + internal без токена); (2) каждая операция помечена: verified с источником (тест/контракт/замер с контуром) ИЛИ derived с явной пометкой «сверка не делалась». «Я посмотрел» — не критерий.
target_rule: >-
  target_codes = целевое поведение, ещё не реализованное. У каждой такой записи обязательны target_owner и target_until. Как только поведение реализовано: код переносится в codes, target_codes/target_owner/target_until удаляются. «Целевое» без срока и владельца — запрещено: это то же, что continue-on-error без даты снятия. Требование к target_until: условие снятия должно быть МАШИННО-ПРОВЕРЯЕМЫМ (env/флаг/конкретный ответ), а не прозой — иначе через месяц никто не поймёт, сработало ли оно. Пример правильной формы: «XDIARY_STRICT_UNKNOWN_FIELDS=1 ставит @DO в smoke-api» (см. Partners.Register). Канон процесса — 5-tech-backlog/tl/ITERATION-PLAN.md §8; при расхождении побеждает §8.
codes_rule: >-
  Коды отказа при ДОСТУПЕ К ОБЪЕКТУ не кодируют владение (2026-11-10 @AR, уточнено по коду и принято @TL):
  критерий — **зависит ли ответ от существования чужого объекта**, а не наличие `{id}` в пути.
  ЗАВИСИТ (был запрос/поиск по id) ⇒ только `404`: «не твой» и «не существует» неразличимы, существование не раскрывается.
  НЕ ЗАВИСИТ (сравнение с `sub`/ролью ДО запроса) ⇒ `403` законен и ничего не раскрывает: ответ одинаков при любом состоянии чужой строки.
  Примеры: `Catalog.*`, `Partners.*`, `Journal.*` — `404`; `Client.Get` — `403` (`ClientsController.cs:109`, сравнение до `_mediator.Send`).
  СТАТУС ПРОВЕРКИ (перепроверено 2026-11-10 17:52, @AR): правило **ПРОВЕРЯЕТСЯ** гейтом `check_api_index` (`check_ownership_codes`, печать `:587-588`). Проба подложенным нарушением: добавил `403` в `codes` у ресурсной `Catalog.Get` в **копии** индекса (`--index`) ⇒ **`rc=1`**. Нюанс, который нашёлся при пробе: сообщение содержит `≡` и на консоли **cp1251** печать падает `UnicodeEncodeError` ⇒ локально `rc=1` приходит **без** строки `::error::`, то есть «нарушение» и «краш печати» выглядят одинаково. В CI (Linux/UTF-8) сообщение печатается; правка печати — зона @DO.
  Значит правило держится ревью; машинная форма: `403` у операции с `{id}` допустим только если перед отказом нет запроса к хранилищу (зона @DO).

auth_rule: >-
  deny-by-default (ADR-026): анонимны только 4 контроллерных маршрута — POST /api/v1/clients, POST /api/v1/clients/{id}/verify, POST /api/v1/clients/refresh, POST /api/v1/privacy/verify-token — плюс GET /health (не контроллер, в индексе отсутствует намеренно). Всё остальное требует JWT; без токена -> 401. GET /clients с токеном -> 405 (маршрут удалён, ADR-026). auth: anonymous-inside = внутренний контур /internal/** (ADR-026 §3 п.4): изнутри сети без токена, снаружи 401. ТРЕБОВАНИЕ К КОДУ (из-за него гейт и красный): анонимность обязана быть ЯВНОЙ — [AllowAnonymous] на этих 4 маршрутах и deny-by-default fallback-политика в каждом BC. Сейчас в коде анонимность держится на ОТСУТСТВИИ политики (у PrivacyController нет ни [AllowAnonymous], ни [Authorize]) — это ровно класс дефекта GET /clients: гейт не может отличить «разрешено» от «политики нет», а человек не видит, где граница. Гейт DO-064 должен сравнивать ТРИ источника и называть, какой разъехался: индекс ↔ allow-list шлюза ↔ явные атрибуты в коде.
internal_rule: >-
  `internal: true` — маршрут ВНУТРЕННЕГО контура: не публикуется в `openapi/*.json`, в публичных сверках не участвует
  (drift `--specs-only`, реестр `BE-095`), требует СЕРВИСНЫЙ JWT (`auth: jwt-service`) и проверяется отдельно — контуром `(ii-c)`.
  Сейчас таких операций 4: `Journal.ListAll`, `Journal.IngestPartnerEvent`, `DailyMetrics.InternalSeries`, `Journal.ClientIds` — все `jwt-service`;
  в снимке из них 2 (`ListAll`, `IngestPartnerEvent`).
  Поэтому при сравнении индекса со спеками исключаются ОБЕ стороны: индекс — по `internal: true`, спеки — по пути `/internal/**`.
  Иначе получается 78 против 80 и вечный `rc=1` на маршрутах, которых в публичном контракте и быть не должно (2026-11-10, @DO `07768c4d9`).
  Проверка: `check_apim_drift.py --specs-only` → `rc=0` (78 = 78). Контур `(ii-c)` (`check_apim_auth.internal_ops`) **отбирает 4** операции:
  по пути `/internal/**` — 4, по `auth: anonymous-inside` — **0** (проверено @AR 2026-11-10: таких записей в индексе не осталось), по `internal: true` — 4.
  Результат прогона `(ii-c)` (сколько из 4 дали `401/403/404`) берётся из его квитанции, а не из этого файла.
request_rule: >-
  Каждая операция `POST` обязана иметь блок `request` (`required` + `types`): это то, что фронт и тесты читают вместо догадок
  (AR-022, 2026-11-07: индекс описывал маршруты журнала, но не тела запросов). Тела берутся ИЗ КОДА команд (`*Commands.cs`), а не
  из воображения. Состояние 2026-11-10 (проверено @AR): `POST` — 54, с `request` — 54, без `request` — 0; у `BC: Journal` — 14 из 14.
  Проверяется флагом `check_api_index.py --require-request` — **включён в CI 2026-11-10** (`ci-guards.yml:146`, @DO; до этого был
  готов, но не подключён — класс «гейт готов ≠ гейт защищает»).
  **Что гейт проверяет и что нет:** он сверяет `required ∪ optional` с ключами `types` (согласованность), но **не** сверяет `types`
  с полями класса команды (истинность). Поэтому «зелёный» здесь = «описание внутренне непротиворечиво».
  **Как проверять истинность (спот-проверка 2026-11-10, @AR):** тело = командный `record` из `*Commands.cs` **минус** поля, которые
  ставит сервер/маршрут (`ClientId` — из `sub`, `AggregateId` — из `:id` маршрута). Проверено на 6 POST подряд:
  `Catalog.Add` (`kind`,`name`), `Catalog.UpdateDetails` (`photo`,`notes`,`brand`,`fantasyPartner`), `AppleHealthGateway.Configure`
  (`metrics`), `AppleHealthGateway.ImportFile` (`fileName`), `Privacy.SetPin`/`ChangePin` (`pin` + `currentPin?`) — **0 расхождений**.
  **Не-nullable `string` = обязательное поле.** Если в командном `record` поле объявлено как `string` (без `?`)
  и в проекте `Nullable=enable`, ASP.NET Core трактует его как **implicit `[Required]`**: запрос без поля → `400`,
  даже если логика эту ветку не использует (случай `Analytics.Events`: `date`/`t` в `optional` давали ложный контракт,
  @TE `TE-100`). Проверка при правке: `git grep -n "public string " -- '*Commands.cs'` и сверка с `required`.
  **Особый случай — событие с дискриминатором:** `Analytics.Events` требовал 8 полей сразу и **не описывал `record`**; исправлено
  2026-11-10 (`required: [eventType]`, остальные в `optional`), проверено по `AnalyticsController.cs:70-80`.
trace_rule: >-
  Любой ответ 5xx обязан нести заголовок `X-Correlation-Id` (тот же, что попал в лог сервиса). Причина — случай 2026-11-07:
  `POST /partners/{id}/name` на dev отдавал 500 с ПУСТЫМ телом и без идентификатора, поэтому связь «запрос → строка в логе»
  восстанавливалась только вручную. Тело 5xx остаётся без подробностей (не течём внутренностями), но корреляция обязательна.
  Проверяется гейтом по любому 5xx в smoke: отсутствие заголовка = дефект.
  СТАТУС РЕАЛИЗАЦИИ (2026-11-10, @AR, `git grep -i -e x-correlation-id -e x-request-id -- 6-msa`): **0 вхождений** ⇒ ни один сервис заголовок не ставит.
  Гейт `9-tests/scripts/check_5xx_correlation.py` при этом **зелёный на пустоте**: `evaluate` смотрит только ответы `>= 500`, поэтому при нуле ошибок квитанция `5xx 0 | нарушено: 0` не подтверждает ничего, а первый настоящий 500 покраснеет **в момент инцидента**.
  ПОРЯДОК ВКЛЮЧЕНИЯ: (1) middleware в API-проектах ставит и **пробрасывает** входящий `X-Correlation-Id`; (2) он же пишется в лог; (3) только после этого гейт становится обязательным. До шага (1) гейт остаётся **в отчёте** (не блокирует) — иначе правило краснеет на деплое в чужой зоне.
  МЕХАНИЗМ (2026-11-10, @TE): «в отчёте» = запуск **без** `--require-5xx`; при `5xx = 0` гейт печатает `::notice::… правило не воспроизведено (проверено запросов N)` (`:146`), то есть «ноль ошибок» и «ноль проверок» — разные строки. С `--require-5xx` (`:113`) тот же `5xx = 0` = отказ (`:148`). Включать `--require-5xx` после шага (1).
  ВОПРОС ВЛАДЕЛЬЦА (2026-11-10 15:30, `chat/ex.md`, строка затем исчезла из файла — оставлена здесь, чтобы не потерялась):
  «Вот это trace.rule это вопрос архитектуры?» — ОТВЕТ @AR (15:31): да, но не «нужно ли», а «кто ставит идентификатор»:
  норма уже принята (2026-11-07), реализации 0, поэтому открыт только момент включения гейта (`--require-5xx` после middleware шага (1)).
  ОТКРЫТО: выбор «все сервисы / только шлюз+`Client` / снять» — за владельцем; до ответа действует строка «ПОРЯДОК ВКЛЮЧЕНИЯ» (гейт в отчёте).

error_body_rule: >-
  По умолчанию тело ошибки (4xx) — СТРОКА сообщения. Структурированное тело ошибки — точечное исключение, объявленное
  у конкретной операции полем `error_body`: {поля}. Вводить структуру «на все операции» можно только отдельным решением
  (меняет форму ошибок у всех операций индекса и всех потребителей). Причина правила: потребитель не должен угадывать, объект там
  или строка (случай app.js:391, 2026-11-06 — фронт читал clientId из строки и фактически угадывал).
  Сейчас структурированных тел ошибок НЕТ ни у одной операции: delivery живёт только в 200 (решение 2026-11-06 21:42).
codes_legend: >-
  codes: {код: смысл}. Правило «что/объект/инструмент+контур» для цифры в квитанции — НЕ здесь, а в каноне §14 `5-tech-backlog/tl/ITERATION-PLAN.md`; поле `verification` ссылается на него, а не пересказывает (решение @LM 2026-11-14).
rules_enforcement: >-
  ПРОВЕРЯЕМОСТЬ ПРАВИЛ ШАПКИ (аудит 2026-11-10, @AR; правило без проверки — это пожелание, поэтому статус у каждого):
  [1] request_rule — ПРОВЕРЯЕТСЯ `check_post_request`, флаг `--require-request` включён в CI 2026-11-10 (`ci-guards.yml:146`).
  [2] codes_rule — ПРОВЕРЯЕТСЯ `check_ownership_codes` (`check_api_index.py:585-589`). Проба подложенным нарушением 2026-11-10: `403` у ресурсной
  `Catalog.Get` в копии индекса => rc=1. Дефект печати: сообщение содержит `≡` и на консоли cp1251 падает UnicodeEncodeError (rc=1 без строки
  ::error::) — правка печати в зоне @DO.
  [3] auth_rule — ПРОВЕРЯЕТСЯ частично, тремя механизмами: анонимность в индексе и в коде против allow-list (`.py:638-653`), наличие
  FallbackPolicy по ADR-026 (`.py:656-661`), пересечение `internal` с allow-list (`.py:643-649`).
  [4] internal_rule — ПРОВЕРЯЕТСЯ: фильтр дрейфа исключает обе стороны (индекс по `internal: true`, спеки по `/internal/**`) и `internal` не может
  попасть в allow-list анонимности. Количество и состав (4 операции, 2 в снимке) сверены 2026-11-10.
  [5] error_body_rule — НЕ ПРОВЕРЯЕТСЯ ни одним инструментом: `error_body` не встречается ни в `tools/`, ни в `gen_openapi.py` (0 вхождений).
  Сегодня нарушения нет (структурированных тел ошибок ни у одной операции), но правило держится дисциплиной, а не гейтом.
  [6] target_rule — НЕ ПРОВЕРЯЕТСЯ: `target_owner`/`target_until`/`target_codes` встречаются только в тексте этого файла и ADR, ни один инструмент
  не требует их парности (`target_codes` без `target_owner` сегодня не поймает никто).
  [7] trace_rule — проверка не определена: решение владельца по объёму (все сервисы / шлюз+Client / снять) не принято, это открытый вопрос, а не устаревание.
  Вывод: из 7 правил шапки гейтом закрыты 4 (1, 2, 3, 4), дисциплиной — 2 (5, 6), открыто — 1 (7).

