  - bc: Client
    method: POST
    path: "/api/v1/clients"
    operationId: Client.Register
    auth: anonymous
    codes: {200: "ok — новый номер: тело id, version, phone, otpExpiresAt, verified, delivery", 409: "номер уже зарегистрирован: тело СТРУКТУРИРОВАННОЕ {error, clientId, delivery}, код переотправлен; 429 при лимите", 400: "validation телефона — тело: СТРОКА", 429: "лимит переотправки: 1/60с на клиента, 5/час на номер"}
    error_body: [error, clientId, delivery]
    delivery_states: "ok=true (провайдер подтвердил) | ok=false (попытка была / канала нет) | поля delivery НЕТ (старый режим: текст без ложного «отправлено»)"
    semantics: "POST /clients = создать клиента (create). Повторный вызов на существующем номере — конфликт 409, а не идемпотентный 200: идемпотентность без Idempotency-Key превращала бы create в upsert-by-phone и скрывала конфликт. Решение 2026-11-06 21:47 (@AR, принято @TL/@BE/@FE)."
    error_body_note: "409 несёт структурированное тело {error, clientId, delivery} — ТОЧЕЧНОЕ исключение из правила «тело ошибки = строка» (см. error_body_rule в шапке), названо в каноне edm-canon §17. Причина: клиенту нужен РЕАЛЬНЫЙ clientId, чтобы показать экран ввода кода, а не угадывать его из storedClientId()."
    idempotency_note: "Отдельной операции переотправки НЕТ: её роль выполняет повторный POST /clients, который на существующем номере отдаёт 409 и переотправляет код. Поэтому лимит 1/60с + 5/час обязателен — иначе это OTP-бомбинг." 
    rate_limit: "429 на повторный POST /clients с существующим номером: не чаще 1 раза в 60 с на клиента и 5 раз в час на номер. Без лимита 409-путь = OTP-бомбинг и траты: сервер переотправляет код по чужому номеру по запросу." 
    order_note: "ПОРЯДОК ПРОВЕРОК (важно для проб и для гонок): `429` (лимитер) проверяется ДО `400` и `409` — `ClientsController.Register` (`ClientsController.cs:29`) отдаёт 429 по `r.RateLimited` раньше, чем `:30` `400` и `:38` `409`. Практическое следствие: `409` без окна лимитера физически не наблюдаем — второй вызов в пределах 60 с законно получает `429` (замер @TE 2026-11-07: 200 → через 65 с 409+clientId → сразу 429)."
    codes_status: verified
    verification: "код: ClientsController.cs (fallback deny-by-default в BC; [AllowAnonymous] :25 (сверено 2026-11-10 по коду; прежняя общая ссылка «:25/:28/:38» была копией)) — 401 без токена, 200/400 через Respond, Forbid/NotFound в Get и Me, 2026-11-14 @AR | СВЕРЕНО 2026-11-10 по коду: `[HttpPost]` :24, `[AllowAnonymous]` :25, 429 :34, 400 :35, 409 :43-45, 200 :47-49; прежняя ссылка «:25/:28/:38» указывала на `[ProducesResponseType]` и комментарий, а не на атрибуты действия"
    request:
      required: [phone]
      optional: []
      note: "формат `phone` — канон `03-ddd/BC-Client/02-aggregate-canvas.md` (AR-025): нормализация → E.164 `^\\+[1-9][0-9]{6,14}$`; невалидный → 400 `phone_invalid` ДО 429 и отправки OTP. Здесь правило НЕ пересказывается (один канон — ссылка)."
    response: {always: ["id", "version", "phone", "otpExpiresAt", "verified"], note: "тело 200 — whitelist-проекция ClientsController.cs:47-49 (otpCode НЕ отдаётся, BE-090); 409 — {error, clientId} (:43-45); `delivery` присутствует ТОЛЬКО в реальном режиме, в тестовом отсутствует намеренно (:38-39)"}
