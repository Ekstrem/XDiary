name: Backend tests (9-tests)

# PDR-16 шаг (b): `ci-tests.yml` разделён на бэкенд и фронт.
# Причина: правка инфраструктуры сериализовалась с прогоном фронта, и один пуш
# вытеснял ожидающий прогон другого артефакта. Гейт выбирается по природе
# изменения (`AGENTS.md` §5.4): `6-msa/**`, `9-tests/**` -> этот файл,
# `8-front/**` -> `ci-front.yml`.

on:
  push:
    branches: ["main"]
    # DO-031: правки задач и чата ролей не триггерят тяжёлые test/front-e2e (иначе
    # каждый пуш в переписку отменяет идущий E2E). Guard'ы — в chat-guards.yml,
    # который теперь слушает и `5-tech-backlog/**` (DO-032: секреты в задачах).
    paths-ignore:
      - '5-tech-backlog/**'
      - '0*/**'
      - '01-user-stories/**'
      - '02-cjm/**'
      - '03-ddd/**'
      - '04-architecture/**'
      - '**/*.md'
  pull_request:
  workflow_dispatch:

# Политика отмены (DO-023, решение владельца 2026-11-05): прогоны НЕ отменяются новым
# пушем — оба джоба идут в очередь. «test не трогать первые 5 минут» GitHub не умеет,
# поэтому эквивалент — не отменять вовсе. Очередь не раздувается: чат-пуши отфильтрованы
# paths-ignore, code-пуши редкие. Отменённый прогон не считается доказательством (TL).

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-tests-test
      # Решение владельца (2026-11-05): не отменять прогон новым пушем (== «не трогать
      # первые 5 минут», который GitHub нативно не умеет). Идём в очередь.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # нужна история: зона считается по `git diff` между базой и головой
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # ADR-028 + @TL 2026-11-14 11:11: тесты сервисов переехали в `6-msa/BC-<X>/src/*Tests`,
      # поэтому прежний шаг (`find 9-tests -name '*.IntegrationTests.csproj'`) находил НОЛЬ
      # проектов и тихо проходил. Теперь зона считается по изменённым BC.
      - name: Определить зону (какие BC изменились)
        id: zone
        shell: bash
        run: |
          set -uo pipefail
          base="${{ github.event.before }}"
          head="${{ github.sha }}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          fi
          all=0
          # новый пуш без предка / dispatch / изменения общих файлов -> весь набор
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
             || [ "${{ github.event_name }}" = "workflow_dispatch" ] || ! git cat-file -e "$base" 2>/dev/null; then
            all=1
          else
            changed=$(git diff --name-only "$base" "$head" || true)
            echo "изменено файлов: $(printf '%s\n' "$changed" | grep -c . || true)"
            if printf '%s\n' "$changed" | grep -qE '^6-msa/(Directory\.|.*\.sln|.*\.props|.*\.targets|shared/)'; then
              echo "изменены общие файлы 6-msa -> весь набор"
              all=1
            fi
          fi
          if [ "$all" = "1" ]; then
            echo "bc_list=ALL" >> "$GITHUB_OUTPUT"
            echo "зона: ALL"
          else
            bcs=$(printf '%s\n' "$changed" | grep -oE '^6-msa/BC-[A-Za-z0-9]+' | cut -d/ -f2 | sort -u | tr '\n' ' ')
            echo "bc_list=${bcs:-NONE}" >> "$GITHUB_OUTPUT"
            echo "зона: ${bcs:-NONE}"
          fi

      - name: Тесты изменённых BC (без соседей — изоляция ADR-028)
        shell: bash
        run: |
          set -uo pipefail
          zone="${{ steps.zone.outputs.bc_list }}"
          if [ "$zone" = "NONE" ]; then
            echo "изменений в BC нет — тесты BC не требуются"
            exit 0
          fi
          fail=0
          found=0
          if [ "$zone" = "ALL" ]; then
            projects=$(find 6-msa -name '*Tests*.csproj' | sort)
          else
            projects=""
            for bc in $zone; do
              projects="$projects $(find "6-msa/$bc" -name '*Tests*.csproj' 2>/dev/null | sort | tr '\n' ' ')"
            done
          fi
          for proj in $projects; do
            found=1
            echo "=== $proj ==="
            dotnet test "$proj" --verbosity minimal || fail=1
          done
          if [ "$found" -eq 0 ]; then
            echo "::warning title=[tests] тестов в зоне нет::в изменённых BC нет *Tests*.csproj"
          fi
          if [ "$fail" -ne 0 ]; then
            echo "::error title=[tests] есть падения::см. вывод dotnet test выше"
            exit 1
          fi
          echo "тесты зоны зелёные" 

