name: Sync board (md -> Issues + Project)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync tasks to Issues + Project
        run: python tools/sync_board.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: "Ekstrem"
          PROJECT_NUMBER: "2"
