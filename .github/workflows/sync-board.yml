name: Sync board (md -> Issues + Project)

on:
  push:
    branches: ["main"]
    # Синк доски — только на задачи (5-tech-backlog/**), не на чат и не на код.
    paths:
      - '5-tech-backlog/**'
      - '!5-tech-backlog/chat/**'
      - 'README.md'
      - 'tools/sync_board.py'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# DO-118 (@TL): синк идемпотентен — он приводит Issues/Project к состоянию
# `5-tech-backlog/**`. Без группы каждый статусный коммит запускал ПОЛНЫЙ обход
# всех issues (сотни REST-вызовов), прогоны копились (12 одновременно) и делили
# лимит токена → ретраи со sleep → очередь CI занята, `dispatch` ждёт.
# Вытеснение безопасно: следующий синк доводит состояние до того же.
concurrency:
  group: sync-board
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync tasks to Issues + Project
        run: python tools/sync_board.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PROJECT_PAT: ${{ secrets.PROJECT_PAT }}
          PROJECT_OWNER: "Ekstrem"
          PROJECT_NUMBER: "2"
