name: Stats (README = задачи)

# DO-101 (@TL 2026-11-06 01:00): гейт наказывал за нормальную работу — статус меняет каждая
# роль, а таблицу в README обновлял никто (Stats краснел 6 раз за вечер 00:36–01:00).
# Норма «README = задачи» НЕ меняется, меняется способ её поддержания: пересчитать и
# закоммитить ботом, а не «проверить и упасть». Проверка остаётся — но как отчёт в шаге,
# который **чинит** расхождение, а не красит CI.
on:
  push:
    branches: ["main"]
    paths:
      - "5-tech-backlog/**"
      - "!5-tech-backlog/chat/**"
      - "tools/stats.py"
      # DO-101: `README.md` намеренно НЕ в paths — иначе бот-коммит снова триггерит workflow
      # и получается петля «бот правит README → бот правит README».
  # PDR-047: guard обязан идти на КАЖДЫЙ PR без фильтра путей — иначе
  # required status check можно включить только для части PR.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Диагностика до правки (таблица актуальна?)
        run: |
          echo "--- до: ---"
          python tools/stats.py --check || echo "::notice::таблица отставала — пересчитываю"

      # На PR ничего не пишем (иначе бот-коммит в ветку PR снова запустит workflow
      # и получится петля): только проверяем, что README соответствует задачам.
      - name: Проверка README на PR (read-only)
        if: github.event_name == 'pull_request'
        run: python tools/stats.py --check

      - name: Пересчитать таблицу статусов
        if: github.event_name != 'pull_request'
        run: python tools/stats.py --write

      - name: Закоммитить README, если изменился
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          if git diff --quiet -- README.md; then
            echo "README актуален — коммит не нужен"
            exit 0
          fi
          git config user.name  "xdiary-bot"
          git config user.email "xdiary-bot@users.noreply.github.com"
          git add README.md
          git commit -m "bot: README = задачи (автообновление)"
          git push

      - name: Контроль после правки (должно быть rc=0)
        run: python tools/stats.py --check
