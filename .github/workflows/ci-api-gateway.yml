name: Build and publish ApiGateway

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/ApiGateway/**'
      - '.github/workflows/ci-api-gateway.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/ApiGateway/**'
      - '.github/workflows/ci-api-gateway.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-api-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/ApiGateway

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore ApiGateway.csproj

    - name: Build
      run: dotnet build ApiGateway.csproj --no-restore --configuration Release

    # DO-072: у шлюза тесты лежат в `6-msa/ApiGateway.Tests` (разрешено ADR-028), а не
    # внутри сервиса. Раньше их гонял только `ci-backend` по жёсткому списку.
    - name: Тесты ApiGateway (в папке сервиса)
      shell: bash
      run: |
        set -uo pipefail
        fail=0
        found=0
        for p in 6-msa/ApiGateway.Tests/*.csproj 6-msa/ApiGateway.Tests/*/*.csproj; do
          [ -e "$p" ] || continue
          found=1
          echo "=== $p ==="
          dotnet test "$p" --configuration Release --verbosity normal || fail=1
        done
        if [ "$found" -eq 0 ]; then
          echo "::error title=[tests] нет проектов ApiGateway.Tests"
          exit 1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "::error title=[tests] есть падения"
          exit 1
        fi
        echo "тесты ApiGateway зелёные"

  docker:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa/ApiGateway
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single
