name: Build and publish Client microservice

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/BC-Client/**'
      # ADR-028 ред. 3: тест пары (consumer-driven) живёт ВНУТРИ сервиса-потребителя
      # (`BC-Client/src/Client.ApiTests`), поэтому отдельный путь не нужен:
      # он уже покрыт `6-msa/BC-Client/**`.
      - '6-msa/E2E/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/BC-Client/**'
      # ADR-028 ред. 3: тест пары (consumer-driven) живёт ВНУТРИ сервиса-потребителя
      # (`BC-Client/src/Client.ApiTests`), поэтому отдельный путь не нужен:
      # он уже покрыт `6-msa/BC-Client/**`.
      - '6-msa/E2E/**'
      - '.github/workflows/ci-client.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-client

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/BC-Client

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/Client.sln

    - name: Build
      run: dotnet build src/Client.sln --no-restore --configuration Release

    # ADR-028: тесты сервиса живут в нём и бегут при его изменении.
    # До 2026-11-13 у Client не было НИ ОДНОГО шага тестов — сборка считалась проверкой.
    # Прогоняем ВСЕ тестовые проекты сервиса (`*.Domain.Tests`, `*.IntegrationTests`,
    # `*.ApiTests` — в т.ч. consumer-driven ожидания пары), а не один захардкоженный:
    # иначе новый тест молча не запускается.
    - name: Тесты Client (в папке сервиса)
      run: |
        set -e
        found=0
        for p in src/*Tests*/*.csproj; do
          [ -e "$p" ] || continue
          found=1
          echo "== $p"
          dotnet test "$p" --configuration Release --verbosity normal
        done
        [ "$found" = "1" ] || { echo "::error::в BC-Client нет тестовых проектов"; exit 1; }

    # ADR-028 этап 1 (@AR 2026-11-13 19:25): пара Client↔Journal должна бежать при
    # изменении ЛЮБОЙ из сторон. Пока она лежит в общем наборе (`6-msa/E2E/...`),
    # запускаем её отсюда; после переноса к потребителю (`BC-Client/src/Client.ApiTests`)
    # шаг станет no-op (hashFiles = '') и его удалит следующая правка.
    - name: Пара Client↔Journal (переходно, до переноса к потребителю)
      if: hashFiles('6-msa/E2E/Contract.Client_Journal/**/*.csproj') != ''
      run: |
        set -e
        for p in 6-msa/E2E/Contract.Client_Journal/**/*.csproj; do
          [ -e "$p" ] || continue
          echo "== $p"
          dotnet test "$p" --configuration Release --verbosity normal
        done

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa
        file: 6-msa/BC-Client/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single
