name: Build and publish Client microservice

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/BC-Client/**'
      # ADR-028 этап 1 (@TL 2026-11-13 19:11): правка Client гоняет ЕГО контрактные
      # тесты. Пока пара лежит в общем наборе — путь указываем здесь; когда тест
      # переедет внутрь сервиса, строка ниже станет не нужна.
      - '6-msa/E2E/Contract.Client_Journal/**'
      - '.github/workflows/ci-client.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/BC-Client/**'
      # ADR-028 этап 1 (@TL 2026-11-13 19:11): правка Client гоняет ЕГО контрактные
      # тесты. Пока пара лежит в общем наборе — путь указываем здесь; когда тест
      # переедет внутрь сервиса, строка ниже станет не нужна.
      - '6-msa/E2E/Contract.Client_Journal/**'
      - '.github/workflows/ci-client.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-client

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/BC-Client

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/Client.sln

    - name: Build
      run: dotnet build src/Client.sln --no-restore --configuration Release

    # ADR-028: тесты сервиса живут в нём и бегут при его изменении.
    # До 2026-11-13 у Client не было НИ ОДНОГО шага тестов — сборка считалась проверкой.
    - name: Тесты Client (в папке сервиса)
      run: dotnet test src/Client.IntegrationTests/Client.IntegrationTests.csproj --no-build --configuration Release --verbosity normal

    # Контрактные ожидания потребителя (пара Client↔Journal). Путь временный:
    # по ADR-028 они должны переехать внутрь BC-Client; шаг исчезнет вместе с переносом.
    - name: Контракт Client↔Journal (если есть)
      if: hashFiles('6-msa/E2E/Contract.Client_Journal/**/*.csproj') != ''
      working-directory: .
      run: |
        set -e
        for p in 6-msa/E2E/Contract.Client_Journal/**/*.csproj; do
          echo "== $p"
          dotnet test "$p" --configuration Release --verbosity normal
        done

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa
        file: 6-msa/BC-Client/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single
