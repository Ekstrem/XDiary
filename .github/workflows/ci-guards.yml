name: CI guards

# PDR-16 шаг (a): guard'ы живут РОВНО В ОДНОМ файле.
# До 02.11 `check-chat` и `guard-secrets` были описаны дважды — здесь и в
# `ci-tests.yml`. Это остаток DO-032: правишь один файл, второй молча отстаёт,
# и в итоге получаешь «два сканера секретов, один из которых врёт».
# Имя `chat-guards.yml` заменено на `ci-guards.yml`, потому что guard'ы уже
# проверяют не только чат: задачи (`5-tech-backlog/**`), `tools/**` и `loop.config.json`.
on:
  push:
    branches: ["main"]
    paths:
      # DO-032: секреты в задачах тоже нужно сканировать. Раньше здесь был только
      # `chat/**`, и правка `5-tech-backlog/<роль>/*.md` не запускала guard-secrets.
      - '5-tech-backlog/**'
      - 'loop.config.json'
      - 'tools/**'
      - '.github/workflows/ci-guards.yml'
  pull_request:
  workflow_dispatch:

# Лёгкие guard'ы (без test/front-e2e). Отменять их можно: результата у них нет,
# пока они не дошли до шага (см. §5.1 про окно 5 минут — оно про тяжёлые джобы).
concurrency:
  group: ci-guards
  cancel-in-progress: true

jobs:
  check-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check chat format (нет молча потерянных сообщений)
        # --strict-times: метка из будущего или нарушенный порядок (после строки-маркера
        # «метка = часы машины») — ошибка. Легаси до маркера не проверяется.
        # Раньше эта строка жила только в chat-guards.yml, а в ci-tests.yml была без
        # --strict-times — то есть на одном и том же пуше проверки расходились.
        run: python tools/chat_lint.py --config loop.config.json --check --strict-times
      - name: "Смена статуса задачи — строка в чате в том же коммите (@TL 2026-11-15 04:20)"
        # Норма владельца: карточка и чат меняются вместе; без строки `→ @TL: <ID> было → стало`
        # смена статуса не считается. Гейт ловит это в последнем коммите.
        if: always()
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            # @TE 11:13: контроль должен доказывать, что умеет краснеть, ДО проверки кода.
          python tools/check_status_chat.py --selftest
          python tools/check_status_chat.py --commit HEAD
          else
            echo "одиночный коммит — сравнивать не с чем"
          fi

      - name: "Регистр выданных решений не зарастает (AWAIT.md, @TL 2026-11-14 22:10)"
        # Решение считается выданным только после подтверждения адресатом (строка «принято»
        # в его outbox или коммит/артефакт). Строки со ✅ в колонке «Статус» не проверяются.
        if: always()
        run: python tools/check_awaits.py --strict

      # @AR 2026-11-14 37:30: этот шаг БЕЗ `if: always()` — он блокирующий: код в
      # `6-msa/**`/`8-front/**` ушёл вперёд lock → «забыли сделать релиз» видно в CI.
      - name: Lock не отстал от кода (release gate, ADR-027)
        run: python tools/gen_images_lock.py --check

      - name: Деплой только по images.lock — ADR-027/DO-066
        # Три пункта @TL 2026-11-14 32:11: скрипты не принимают тег, у workflow нет inputs.tag,
        # откат — revert lock-коммита, а не `podman tag` на сервере.
        if: always()
        run: |
          python tools/check_lock.py --selftest
          python tools/check_lock.py
          python tools/gen_images_lock.py --check

      - name: EDM-маркер и код (DO-058, канон @AR 2026-11-04)
        # Двусторонний: маркер без кода = «долг закрыт» на бумаге; код без маркера = не переведён.
        # По умолчанию строгих BC нет (переделка не начата), поэтому сегодня rc=0 и только
        # предупреждения. Строгий режим включается точечно: --strict-bc BC-X,BC-Y.
        run: |
          python tools/check_edm.py --selftest
          python tools/check_edm.py --range "origin/main...HEAD"

      - name: "Дрейф контура в .env — хосты БД (DO-076, @TL 2026-11-05 02:33)"
        # Инцидент 2026-11-05: в прод-`secrets/.env` 10 строк ConnectionStrings__* смотрели на
        # dev-хост 77.91.73.67 вместо прод-БД 10.89.9.10. До первого пересоздания контейнера
        # дефект невидим; при пересоздании сервис падает 28P01 (или, хуже, пишет в чужую БД).
        #
        # Гейт проверяет только ИМЕНА ХОСТОВ (пароли не читаются и не печатаются), поэтому
        # его можно гонять в публичном CI. Настоящего .env в репозитории нет — проверяем
        # двумя сторонами (§5.4): дефект (dev-хост → rc=1) и норма (прод-хост → rc=0).
        run: |
          python tools/check_env_hosts.py --selftest

          printf 'ConnectionStrings__JournalDb=Host=77.91.73.67;Port=5432;Database=journal;Username=journal;Password=fake\n' \
            > /tmp/drift.env
          if python tools/check_env_hosts.py --env /tmp/drift.env --expect 10.89.9.10; then
            echo "::error::гейт пропустил dev-хост в прод-.env — это инцидент, а не мелочь"
            exit 1
          else
            echo "дефект пойман: dev-хост даёт rc=1 ✔"
          fi

          printf 'ConnectionStrings__JournalDb=Host=10.89.9.10;Port=5432;Database=journal;Username=journal;Password=fake\n' \
            > /tmp/ok.env
          python tools/check_env_hosts.py --env /tmp/ok.env --expect 10.89.9.10
          echo "норма принята: прод-хост даёт rc=0 ✔"


      - name: Реестр API ↔ код — DO-064 (множества, codes, allow-list анонимности)
        # Индекс `04-architecture/api-index.yaml` — реестр контракта (ADR-025). Гейт сверяет
        # набор операций с контроллерами и область auth по ADR-026 (6 BC с fallback).
        if: always()
        run: python tools/check_api_index.py


      # DO-079/BE-069: тот же класс, что BE-067 — `IPaging` передаётся null (`null!`
      # глушит только компилятор, а библиотека читает `paging.Page` сразу). За сутки
      # это случилось трижды в разных BC (journal → partners), поэтому теперь машинно.
      # DO-079/BE-068: тот же класс, что IPaging-канон — read-модель из
      # `AddReadStorePostgres` должна быть в маппинге своего контекста, иначе сервис падает
      # `Cannot create a DbSet for …`. Случилось трижды (journal два раза, partners один).
      # @AR 15:00: маппинг есть, а DDL неполон — EF выбирает ВСЕ маппированные колонки,
      # поэтому ошибка переезжает из `42P01` в `42703`. Проверяем разность множеств:
      # поля модели ⊆ колонки `CREATE TABLE IF NOT EXISTS`.
      - name: "Канон «поля read-модели ⊆ колонки DDL» (@AR 15:00)"
        if: always()
        run: |
          python tools/check_readstore_ddl.py --selftest
          python tools/check_readstore_ddl.py --root 6-msa
      - name: Канон «read-модель смаплена в контексте» (BE-068)
        if: always()
        run: |
          python tools/check_readstore_mapping.py --selftest
          python tools/check_readstore_mapping.py --root 6-msa
      - name: Канон «IPaging не null» (BE-067/BE-069)
        # `always()`: гейт должен давать вердикт независимо от того, упал ли
        # предыдущий шаг. Иначе он «skipped», и это читается как «проверено»,
        # хотя проверки не было (случай на прогоне #1988).
        if: always()
        run: |
          python tools/check_null_paging.py --selftest
          python tools/check_null_paging.py --root 6-msa
      - name: "Канон регистрации EventStoreDbContext (@AR 22:40/23:25)"
        # Правило: в каждом Program.cs с `AddEventStorePostgres` — РОВНО ОДНА типизированная
        # `AddDbContext<…EventStoreDbContext>` и она ПОСЛЕ DF-вызова (последняя побеждает).
        # История: `journal` и `partners` падали до `Bind`, потому что контекст получал
        # необобщённые `DbContextOptions`; `grep → 0` как критерий отменён (@AR) — удаление
        # типизированной регистрации делает хуже. Проверяем число и порядок строк.
        # strict: дефект исправлен в `68644da1` (убран ручной `AddDbContext<ReadDbContext>`
        # в Journal/Partners — он перерегистрировал контекст без маппингов read-моделей).
        run: |
          python tools/check_eventstore_registration.py --selftest
          python tools/check_eventstore_registration.py

      - name: Изоляция тестов — ADR-028 (б, в, д, е)
        # (б) тест не ссылается ProjectReference на чужой BC — иначе он не собирается без
        # чужого сервиса; (в) сервис не подключает E2E; (д) нет общих тестовых папок;
        # (е) каждый *Tests.csproj лежит в папке своего сервиса.
        if: always()
        run: python tools/check_test_isolation.py

      - name: В 9-tests только браузерные E2E (ADR-028)
        # Две стороны по §5.4: норма — маркер `front-e2e.md` + Playwright у проекта;
        # дефект — подложенный C#-проект без маркера (rc=1). Плюс обратная проверка:
        # постороннее в `9-tests` (нагрузочные скрипты и т.п.) — ошибка, а не «мелочь».
        if: always()
        run: python tools/check_front_e2e.py

      # @TE 11:03: гейт фронтового read-path (артефакты + role=alert + busyRun + версия)
      # и FE-044 (ранний выход по `fromCache`, иначе бейдж «могли устареть» висит на свежих
      # данных). Требует `js/app.js`, `js/repository.js`, `sw.js`. Доказан на дефекте:
      # удаление строки `if (!st || !st.fromCache) return;` → rc=1 (проверено 2026-11-05).
      - name: "Фронт: read-path и индикатор (FE-044, @TE)"
        if: always()
        run: |
          python 9-tests/scripts/check_front_readpath.py --selftest
          python 9-tests/scripts/check_front_readpath.py
      - name: "Спеки фронта идут через E2E-фикстуру + контракт __XDIARY_E2E__ (TE-024, @TE 2026-11-04 08:37)"
        # Две части: (1) если в `*.spec.js` есть `page.goto(`, в файле обязана быть фикстура
        # (`installBase`/`loginWithPin`/`seedSession`) — иначе страница уйдёт на DEFAULT_BASE;
        # (2) `8-front/js/api.js` обязан содержать `__XDIARY_E2E__`.
        # Доказано @TE на дефекте и норме (REF=d7a40d36): норма 19 спек/3 с навигацией PASS,
        # подмена флага во фронте → FAIL. Прогон ~0.3 с, без сети и браузера.
        if: always()
        run: python 9-tests/scripts/check_front_specs_base.py
      - name: Внешняя поверхность = только шлюз (ADR-026)
        # Любой сервис кроме `api-gateway` с `ports:` в compose публикует порт на хост —
        # это реальная экспозиция, а не «риск». Внутренняя достижимость закрывается auth.
        if: always()
        run: python tools/check_ports.py

      - name: Проверить NUL-байты и прочие C0-символы в md
        if: always()
        run: python tools/check_nul.py
      - name: Тесты самого сканера секретов (PDR-20)
        # Гейт должен проверяться гейтом: фейковый ключ -> красный,
        # описание маскирования -> зелёный. Иначе правка сканера не проверяется.
        run: python tools/test_check_secrets.py
      - name: Тест предохранителя git_sync (untracked -> отказ, не TypeError)
        # Инцидент 02.11: предохранитель падал с TypeError вместо отказа (@TE 07:18).
        # Файл-проба создаётся и удаляется самим тестом; пуша нет.
        run: python tools/test_git_sync.py
      - name: Тест режима stats --ref (сверка с git-ref, а не только с деревом)
        # Иначе `stats --check` говорит «актуален», когда правка ещё локальная,
        # а origin живёт со старой таблицей (02.11: 176/177 и 5/6).
        run: python tools/test_stats_ref.py
      - name: Тест классификации rebase-состояния (git_sync --fix-state)
        # Ошибка здесь опасна: признав живой rebase "пустым", --fix-state его удалит.
        # Тест проверяет чистую функцию, файловая система не нужна.
        run: python tools/test_git_sync_state.py

  guard-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (нужна история для --range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить секреты и их фрагменты в пушимом диапазоне
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          head="${AFTER:-HEAD}"
          git cat-file -e "${head}^{commit}" 2>/dev/null || head=HEAD
          if [ -n "${PR_BASE:-}" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            range="${PR_BASE}..${head}"            # pull_request: база PR -> голова
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            python tools/check_secrets.py --selftest
          range="${BEFORE}..${head}"             # push: всё пушимое
          else
            range="${head}~1..${head}"             # первый прогон/ручной запуск
          fi
          echo "range: ${range}"
          python tools/check_secrets.py --config loop.config.json --range "$range"

      # DO-050/инцидент 05:00: минутный нерабочий update.sh на проде.
      # Синтаксис серверных скриптов и python-инструментов проверяется ДО деплоя.
      - name: Синтаксис скриптов (bash -n / py_compile)
        run: |
          set -euo pipefail
          fail=0
          for f in $(git ls-files '7-deploy/*.sh' 'tools/*.sh' '*.sh'); do
            [ -f "$f" ] || continue
            if ! bash -n "$f"; then echo "::error file=$f::bash -n failed"; fail=1; fi
          done
          for f in $(git ls-files 'tools/*.py' '7-deploy/*.py'); do
            [ -f "$f" ] || continue
            if ! python3 -m py_compile "$f"; then echo "::error file=$f::py_compile failed"; fail=1; fi
          done
          exit $fail
