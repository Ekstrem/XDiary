name: Build and publish SomaticSeries microservice

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/BC-SomaticSeries/**'
      - '6-msa/Shared/**'
      - '.github/workflows/ci-somatic-series.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/BC-SomaticSeries/**'
      - '6-msa/Shared/**'
      - '.github/workflows/ci-somatic-series.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-somatic-series

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/BC-SomaticSeries

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/SomaticSeries.sln

    - name: Build
      run: dotnet build src/SomaticSeries.sln --no-restore --configuration Release
    # ADR-028 + @TL 2026-11-14 19:11: прогон ВСЕХ тестовых проектов сервиса
    # (`*.Domain.Tests`, `*.IntegrationTests`, `*.ApiTests`), а не списка из двух имён:
    # новый тест иначе не запускается. Пустой список = `::error::` («нет тестов» ≠ зелёный).
    - name: Тесты SomaticSeries (в папке сервиса)
      shell: bash
      run: |
        set -uo pipefail
        fail=0
        found=0
        for p in src/*Tests*/*.csproj; do
          [ -e "$p" ] || continue
          found=1
          echo "=== $p ==="
          dotnet test "$p" --configuration Release --verbosity normal || fail=1
        done
        if [ "$found" -eq 0 ]; then
          echo "::error title=[tests] в BC-SomaticSeries нет тестовых проектов::ждали src/*Tests*/*.csproj"
          exit 1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "::error title=[tests] есть падения::см. вывод dotnet test выше"
          exit 1
        fi
        echo "тесты BC-SomaticSeries зелёные"


    - name: Unit Tests
      run: dotnet test src/SomaticSeries.Domain.Tests/SomaticSeries.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Integration Tests
      run: dotnet test src/SomaticSeries.IntegrationTests/SomaticSeries.IntegrationTests.csproj --configuration Release --verbosity normal

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa
        file: 6-msa/BC-SomaticSeries/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single