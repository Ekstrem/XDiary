name: TE-050 partner soft-delete (по запросу @TE)

# Зачем: `dotnet test` нельзя запустить ни в песочнице @TE, ни в песочнице @DO —
# testhost падает ДО тестов с `System.ComponentModel.Win32Exception (5)` в
# `Process.GetProcessHandle` (ограничение на handle'ы процессов). Сборка при этом работает.
# Поэтому прогон делается здесь, на runner'е, а результат печатается аннотацией:
# аннотации доступны по API даже когда логи недоступны.
#
#   gh workflow run test-partner-softdelete.yml     (или dispatch из tools/)

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "XDIARY_E2E_BASE_URL (стенд)"
        required: false
        default: "https://xdiary-vps2.taile0b6ee.ts.net"
      gate:
        description: "XDIARY_PARTNERS_DIRECTORY (1 = тест истории включён)"
        required: false
        default: "1"

jobs:
  partner-softdelete:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Сборка ApiTests (должна быть rc=0)
        run: dotnet build 6-msa/BC-Journal/src/Journal.ApiTests --nologo
      - name: Прогон 4 кейсов PartnerSoftDelete
        id: run
        env:
          XDIARY_E2E_BASE_URL: ${{ inputs.base_url }}
          XDIARY_E2E_TEST_OTP: "000000"
          XDIARY_PARTNERS_DIRECTORY: ${{ inputs.gate }}
        run: |
          set +e
          dotnet test 6-msa/BC-Journal/src/Journal.ApiTests \
            --no-build --filter PartnerSoftDelete \
            --logger "console;verbosity=normal" 2>&1 | tee /tmp/test.log
          rc=${PIPESTATUS[0]}
          # DO: vstest печатает не только `Failed!/Passed!`, но и блок
          # `Total tests: N / Passed: n / Failed: m` — прежний grep его не видел
          # и печатал `passed=0 failed=0` при реальных 3/1 (прогон #11, TE-050).
          line=$(grep -Eo 'Failed!|Passed!|Test Run (Failed|Successful)\.' /tmp/test.log | tail -1)
          counts=$(grep -Eo '(Failed|Passed):[[:space:]]+[0-9]+' /tmp/test.log | tail -6)
          passed=$(echo "$counts" | grep -oE 'Passed:[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | tail -1)
          failed=$(echo "$counts" | grep -oE 'Failed:[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | tail -1)
          total=$(grep -Eo 'Total tests:[[:space:]]+[0-9]+' /tmp/test.log | grep -oE '[0-9]+' | tail -1)
          echo "passed=${passed:-0} failed=${failed:-0} rc=$rc gate=$XDIARY_PARTNERS_DIRECTORY" >> "$GITHUB_OUTPUT"
          echo "::notice title=TE-050 result::passed=${passed:-0} failed=${failed:-0} total=${total:-?} gate=$XDIARY_PARTNERS_DIRECTORY rc=$rc ($line)"
          # Логи джобы по API недоступны (403), поэтому диагностику кладём в аннотацию:
          # многострочный текст через %0A, иначе CI съест переводы строк.
          # Берём не хвост, а строки, объясняющие причину.
          # Сообщения ошибок важнее имён тестов: берём блоки "Error Message:" с продолжением.
          diag=$(grep -A4 'Error Message' /tmp/test.log | head -40 \
                 | tr '\n' '~' | sed 's/~/%0A/g' | cut -c1-4000)
          echo "::error title=TE-050 diagnosis::${diag:-пусто}"
          {
            echo "### TE-050 PartnerSoftDelete"
            echo ""
            echo "- REF: \`${{ github.sha }}\`"
            echo "- passed: **${passed:-0}**, failed: **${failed:-0}**"
            echo "- gate \`XDIARY_PARTNERS_DIRECTORY=${XDIARY_PARTNERS_DIRECTORY}\`, base: $XDIARY_E2E_BASE_URL"
            echo "- итог: ${line:-нет строки итога}, rc=$rc"
          } >> "$GITHUB_STEP_SUMMARY"
          exit $rc
