name: Front E2E (8-front + 9-tests/RnD)

# PDR-16 шаг (b): фронтовый гейт отдельно от бэкендового.
#
# DO-032 (@DO 2026-11-06 05:0x, решение по запросу @TE): браузер больше НЕ бежит на каждый push.
# Причина из измерений: прогоны шли по 3–4 одновременно (после снятия `concurrency` в DO-100 п.3),
# каждый мутирует ЖИВОЙ стенд (создаёт и удаляет партнёров, записи, каталог), и очистка одного
# прогона удаляла данные другого — отсюда 404 на `/when`, пустой `#view-partners`, `link-client` 400,
# которые выглядели как продуктовые дефекты.
#
# Разделение:
#   * `spec-gates` — на push/pull_request: только СТАТИЧЕСКИЕ гейты по спекам (`check_e2e_all`),
#     секунды, ничего не создаёт, очередь не занимает;
#   * `front-e2e` — только `workflow_dispatch` и ночное расписание (04:00 UTC): там живой стенд,
#     очистка данных и 15–20 минут браузера. `concurrency` возвращён (сталкивать два ручных
#     прогона нельзя), `cancel-in-progress: false` — прерывать прогон запрещено (§5.1).

on:
  push:
    branches: ["main"]
    paths-ignore:
      - '5-tech-backlog/**'
      - '01-user-stories/**'
      - '02-cjm/**'
      - '03-ddd/**'
      - '04-architecture/**'
      - '0*/**'
      - 'docs/**'
      - '*.md'
      - '**/*.md'
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

jobs:
  changes:
    # DO-103 (@TL 2026-11-13 00:39 «да» на безопасный вариант @DO): браузерный джоб нужен
    # на PR, но не на каждый — только если тронуты фронт или спеки. Так очередь живого
    # стенда не занимается зря (причина DO-032), а auto-проверка UI появляется.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      front: ${{ steps.filter.outputs.front }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -uo pipefail
          base="${BASE_SHA:-}"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "front=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$base" HEAD | grep -qE '^(8-front/|9-tests/RnD/front-e2e/|9-tests/scripts/check_e2e_all)'; then
            echo "front=true" >> "$GITHUB_OUTPUT"
          else
            echo "front=false" >> "$GITHUB_OUTPUT"
          fi

  spec-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: E2E-гейты по спекам (check_e2e_all)
      run: python 9-tests/scripts/check_e2e_all.py
  front-e2e:
    needs: [spec-gates, changes]
    # DO-103: ручной запуск и ночное расписание — всегда; PR — только при изменениях
    # фронта/спек (`changes`); push в main — как и было, не гоняем (там ci-front дешёвый).
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.front == 'true')
    runs-on: ubuntu-latest
    # @TE 2026-11-06 08:26: 19 падений × 90 с съедают бюджет — 60 -> 75 минут.
    timeout-minutes: 75
    concurrency:
      group: front-e2e-stand
      cancel-in-progress: false
    env:
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
      XDIARY_E2E_PIN: '1234'
      XDIARY_BUSY: '1'
      XDIARY_STALENOTE: '1'
      XDIARY_READPATH_OFFLINE: '1'
      XDIARY_READPARITY: '1'
    steps:
    - name: Ждать здоровый dev-стенд (DO-041)
      run: "set -uo pipefail\nbase=\"${XDIARY_E2E_BASE_URL}\"\ncode=000\nfor i in $(seq 1 20); do\n  code=$(curl -s -o /dev/null -m 10 -w '%{http_code}' \"$base/health\" || echo 000)\n  echo \"попытка $i:\
        \ GET $base/health -> $code\"\n  if [ \"$code\" = \"200\" ]; then\n    echo \"стенд здоров (попыток: $i)\"\n    echo \"### стенд: /health -> 200 (попыток: $i)\" >> \"$GITHUB_STEP_SUMMARY\"\n   \
        \ exit 0\n  fi\n  sleep 15\ndone\necho \"[infra] stand-unhealthy: /health не отдал 200 за 20 попыток, последний код $code\"\necho \"::error title=[infra] stand-unhealthy::dev-стенд не поднялся за\
        \ 5 минут (последний код $code). Это дефект инфраструктуры, а не продукта: падения E2E в этом прогоне не считать регрессией.\"\n{\n  echo \"### [infra] stand-unhealthy\"\n  echo \"\"\n  echo \"\
        Последний код ответа: \\`$code\\`. Падения E2E в этом прогоне не считать регрессией продукта.\"\n} >> \"$GITHUB_STEP_SUMMARY\"\nexit 1\n"
    - name: Очистить накопленные E2E-данные на dev (DO-044)
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.DEV_SSH_HOST }}
        username: ${{ secrets.DEV_SSH_USER }}
        key: ${{ secrets.DEV_SSH_KEY }}
        script: "SCRIPT=/opt/xdiary/7-deploy/cleanup-e2e-dev.sh\nif [ ! -f \"$SCRIPT\" ]; then\n  echo \"::warning::скрипт очистки не найден на стенде — прогон без очистки\"\n  exit 0\nfi\n# @TL 17:57:\
          \ удаляем ТОЛЬКО тестовые телефоны (+7999…) и печатаем отчёт\n# «до/после», чтобы было видно, что и сколько удалено (журнал/аналитика не задеты).\necho \"=== DRY-RUN (что будет удалено) ===\"\n\
          bash \"$SCRIPT\" | tee /tmp/cleanup-dry.txt\necho \"=== APPLY (--clients: только +7999…) ===\"\nbash \"$SCRIPT\" --apply --clients | tee /tmp/cleanup-apply.txt\n{\n  echo \"### Очистка dev перед\
          \ прогоном (DO-044)\"\n  echo\n  echo '```'\n  echo \"--- dry-run ---\"\n  cat /tmp/cleanup-dry.txt\n  echo \"--- apply ---\"\n  cat /tmp/cleanup-apply.txt\n  echo '```'\n} >> \"${GITHUB_STEP_SUMMARY:-/dev/null}\"\
          \n"
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install deps
      working-directory: 9-tests/RnD/front-e2e
      run: npm ci || npm install
    - name: Install Playwright browsers
      working-directory: 9-tests/RnD/front-e2e
      run: npx playwright install --with-deps chromium
    - name: Front E2E
      working-directory: 9-tests/RnD/front-e2e
      run: npm test
    - name: Сохранить артефакты Playwright
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: front-e2e-results
        path: 9-tests/RnD/front-e2e/test-results/
        if-no-files-found: warn
        retention-days: 7
