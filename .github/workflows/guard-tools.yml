name: Guard tools (копии инструментов)

# Инструменты живут в LoopMaker и копируются в проект. Копия не должна расходиться
# молча: правка копии без обновления tools/.sources.json — ошибка.
# Синхронизация: python tools/sync_tools.py --pull --from ../LoopMaker

on:
  push:
    branches: ["main"]
    paths:
      - 'tools/**'
      - '.github/workflows/guard-tools.yml'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: guard-tools-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guard-tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Копии совпадают с манифестом
        run: python tools/sync_tools.py --check
      - name: PR не делает гейты устаревшими (вариант «а», владелец 2026-11-21)
        # Переименовал/удалил файлы — обнови гейт, который ищет их паттерн, В ТОМ ЖЕ PR.
        # Красит только НОВУЮ сталость от этого PR; прежняя (например от bb2b4b275) — warning.
        run: |
          python tools/check_gate_freshness.py --selftest
          python tools/check_gate_freshness.py --base origin/main
      # Владелец 2026-11-24 (BE-148, @LM): `#pragma warning disable` — обход гейта
      # качества (QG-612 sync-over-async подавляли директивой вместо устранения причины).
      # Инструмент LM (#3314) в main; подключение в CI — зона @DO. Ставлю в guard-tools,
      # а не в ci-guards: `check-chat` там не required, а guard-tools — required,
      # и по эффекту это ровно то, что просил @LM («шаг, required»).
      - name: "Запрет #pragma warning disable (BE-148)"
        run: |
          python tools/check_pragma_disable.py --selftest
          python tools/check_pragma_disable.py
      - name: Каждый тест-проект покрыт workflow (DO-156, advisory → strict позже)
        # Класс «написали тест, но не включили в CI». Сейчас ::warning с именами
        # (переходный период по карточке); после стабилизации — --strict.
        run: |
          python tools/check_test_coverage_ci.py --selftest
          python tools/check_test_coverage_ci.py
