name: Guard (роль не вышла за зону)

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (нужна вся история для range-diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить зоны ролей
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          after="${AFTER:-}"
          if [ -z "$after" ] || ! git cat-file -e "${after}^{commit}" 2>/dev/null; then
            after=HEAD
            # 2026-11-10 (@DO): раньше здесь был `range="${after}~1..${after}"` — ТОЛЬКО последний
            # коммит. Из-за этого коммит, приехавший в main merge-ом или в пакете из нескольких,
            # не проверялся вовсе (случай @TE `a086700f8`: локально `--range a086700f8~1..a086700f8`
            # даёт rc=1, а прогон был зелёный). Теперь при недоступном after берём before, если он
            # известен, иначе окно ~20 коммитов, и явно предупреждаем в лог.
            if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              range="${BEFORE}..${after}"
            else
              base="$(git rev-list --max-count=21 "$after" | tail -1)"
              if [ -n "$base" ] && git rev-parse --verify "${base}~1" >/dev/null 2>&1; then
                range="${base}~1..${after}"
              else
                range="$(git rev-list --max-parents=0 HEAD | head -1)..${after}"
              fi
              echo "::warning::guard-paths: before/after неизвестны — проверяю окно коммитов ($range), а не один"
            fi
          else
            range="${BEFORE}..${after}"
          fi
          echo "range: ${range}"


      - name: Проверить триггеры workflow (paths-фильтры)
        run: python tools/check_workflow_paths.py
