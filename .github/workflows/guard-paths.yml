name: Guard (роль не вышла за зону)

on:
  push:
    branches: ["main"]
  # PDR-047: guard обязан идти на КАЖДЫЙ PR без фильтра путей — иначе
  # required status check можно включить только для части PR.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (нужна вся история для range-diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить зоны ролей
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          after="${AFTER:-}"
          if [ -z "$after" ] || ! git cat-file -e "${after}^{commit}" 2>/dev/null; then
            after=HEAD
            # 2026-11-10 (@DO): раньше здесь был `range="${after}~1..${after}"` — ТОЛЬКО последний
            # коммит. Из-за этого коммит, приехавший в main merge-ом или в пакете из нескольких,
            # не проверялся вовсе (случай @TE `a086700f8`: локально `--range a086700f8~1..a086700f8`
            # даёт rc=1, а прогон был зелёный). Теперь при недоступном after берём before, если он
            # известен, иначе окно ~20 коммитов, и явно предупреждаем в лог.
            if [ -n "${BEFORE:-}" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              range="${BEFORE}..${after}"
            else
              base="$(git rev-list --max-count=21 "$after" | tail -1)"
              if [ -n "$base" ] && git rev-parse --verify "${base}~1" >/dev/null 2>&1; then
                range="${base}~1..${after}"
              else
                range="$(git rev-list --max-parents=0 HEAD | head -1)..${after}"
              fi
              echo "::warning::guard-paths: before/after неизвестны — проверяю окно коммитов ($range), а не один"
            fi
          else
            range="${BEFORE}..${after}"
          fi
          echo "range: ${range}"


      # 2026-11-11 (@TL 02:20, `1549`): гейт зон в CI НЕ ВЫЗЫВАЛСЯ ВООБЩЕ —
      # `git grep check_paths origin/main -- .github` → 0 вхождений. Скрипт существует,
      # у него дефолт `--range HEAD~1..HEAD` (один коммит), поэтому выход из зоны
      # «смывался» следующим коммитом. Это тот же класс, что «зелёный на пустоте».
      # Здесь проверяем ТОТ ЖЕ range, что вычислили выше, и на push — from before до sha.
      - name: Роль не вышла за зону (check_paths на диапазон)
        env:
          RANGE: ${{ github.event_name == 'push' && format('{0}..{1}', github.event.before, github.sha) || 'origin/main..HEAD' }}
        run: |
          set -uo pipefail
          set +e
          # before может быть (а) нулевым SHA — первый пуш/force, (б) НЕДОСТИЖИМЫМ
          # (force-push, чужой клон): тогда `rev-list before..sha` падает не сообщением
          # «не смог вычислить диапазон», а внутренней ошибкой check_paths, и гейт
          # отключают (@AR 17:01, `1291`). Оба случая ведём одним путём: окно + warning.
          BEFORE="${RANGE%%..*}"
          fallback=""
          case "$BEFORE" in
            0000000000000000000000000000000000000000*)
              fallback="before — нулевой SHA (первый пуш/force)"
              ;;
            *)
              if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                fallback="before=${BEFORE:0:12} недостижим локально (force-push/чужой клон)"
              fi
              ;;
          esac
          if [ -n "$fallback" ]; then
            BASE="$(git rev-list --max-count=21 HEAD | tail -1)"
            if [ -n "$BASE" ] && git rev-parse --verify "${BASE}~1" >/dev/null 2>&1; then
              RANGE="${BASE}~1..HEAD"
            else
              RANGE="$(git rev-list --max-parents=0 HEAD | head -1)..HEAD"
            fi
            echo "::warning::guard-paths: ${fallback} — проверяю окно ${RANGE}"
          fi
          echo "check_paths --range ${RANGE}"
          python tools/check_paths.py --range "${RANGE}"
          rc=$?
          [ "$rc" = "0" ] || echo "::error::guard-paths: выход за зону в диапазоне ${RANGE} (rc=$rc)"
          exit "$rc"

      - name: Проверить триггеры workflow (paths-фильтры)
        run: python tools/check_workflow_paths.py
