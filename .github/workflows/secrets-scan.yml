# 2026-11-11 (DO-116): `guard-secrets` в `ci-guards.yml` зовёт `check_secrets.py` только
# с `--range` (`:320`) — то есть проверяются ИЗМЕНЁННЫЕ файлы. Следствие: секрет, попавший
# в файл раньше и с тех пор не тронутый, не проверяется никогда (ровно так жила утечка
# `chat/be.md:233`: обычные пуши её не видели, а полный локальный прогон давал `rc=1`).
#
# Этот workflow — ПОЛНЫЙ скан по расписанию. Он намеренно:
#   • НЕ подписан на `push` (не блокирует разработку и не вытесняется пушем);
#   • НЕ входит в required checks (его красный — сигнал, а не запрет пуша);
#   • различает «чисто» (rc=0) и «не измерено» (rc=2): иначе «зелёный при нуле
#     просмотренных файлов» неотличим от «правда чисто».
name: Secrets full scan (полный скан, не только изменённые файлы)

on:
  schedule:
    # ежедневно 04:17 UTC — вне окна релизов, минутная метка не «ровно час»
    - cron: "17 4 * * *"
  # PDR-047: guard обязан идти на КАЖДЫЙ PR без фильтра путей — иначе
  # required status check можно включить только для части PR.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Самопроверка инструмента (тесты правил)
        run: python tools/test_check_secrets.py

      - name: Полный скан (без --range)
        run: |
          set -uo pipefail
          set +e
          out="$(python tools/check_secrets.py --config loop.config.json 2>&1)"
          rc=$?
          printf '%s\n' "$out"
          files="$(printf '%s\n' "$out" | sed -n 's/.*файлов проверено: \([0-9][0-9]*\).*/\1/p' | tail -1)"
          leaks="$(printf '%s\n' "$out" | sed -n 's/^утечек \([0-9][0-9]*\)$/\1/p' | tail -1)"
          case "$rc" in
            0)
              echo "::notice::secrets-full-scan: чисто · файлов проверено: ${files:-?} · утечек 0"
              ;;
            1)
              echo "::error::secrets-full-scan: НАЙДЕНЫ УТЕЧКИ · файлов проверено: ${files:-?} · утечек: ${leaks:-?} (адреса выше)"
              ;;
            *)
              # rc=2 и прочее — «не измерено», отдельный исход, НЕ зелёный
              echo "::error::secrets-full-scan: НЕ ИЗМЕРЕНО (rc=$rc) — скан не выполнился, «чисто» из этого не следует"
              ;;
          esac
          exit "$rc"
