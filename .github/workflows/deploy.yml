name: Deploy (dev → prod)

on:
  push:
    branches: [ main ]
    # Деплой — только на изменения кода/инфры. Чат, задачи, доки и .md не триггерят
    # полный конвейер dev→prod (раньше каждое сообщение в чате гоняло деплой).
    paths-ignore:
      - '5-tech-backlog/**'
      - '0*/**'
      - '01-user-stories/**'
      - '02-cjm/**'
      - '03-ddd/**'
      - '04-architecture/**'
      - 'app/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = single/latest)'
        required: false
        default: ''

# Один деплой за раз (несколько пушей агентов не гоняют параллельно).
concurrency:
  group: deploy-dev-prod
  cancel-in-progress: false

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Compute tag
        run: echo "TAG=${TAG_INPUT:-single}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}
      - name: Deploy dev (VPS-2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: TAG
          script: |
            cd /opt/xdiary/7-deploy
            bash update.sh "$TAG"
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo DEV_OK

  # TE-022 / ADR-020 п.3 — блокирующий smoke (условие пропуска в prod).
  smoke:
    needs: deploy-dev
    runs-on: ubuntu-latest
    env:
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
      XDIARY_E2E_PIN: "1234"
    steps:
      - name: Check dev /health
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://xdiary-vps2.taile0b6ee.ts.net/health || echo 000)
            if [ "$code" = "200" ]; then echo "DEV_HEALTH_OK"; exit 0; fi
            sleep 5
          done
          echo "DEV_HEALTH_FAILED"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: API-E2E (9-tests/E2E, все 9)
        run: dotnet test 9-tests/E2E/E2E.Tests/E2E.IntegrationTests.csproj --verbosity minimal
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: 9-tests/RnD/front-e2e
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright install --with-deps chromium
      - name: UI smoke (add-partner, wizard-record, change-pin)
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright test add-partner wizard-record change-pin

  deploy-prod:
    needs: smoke
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Compute tag
        run: echo "TAG=${TAG_INPUT:-single}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}
      - name: Deploy prod (VPS-1)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: TAG
          script: |
            bash /home/deploy/update.sh "$TAG"
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo PROD_OK
