name: Deploy (dev → prod)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = auto commit SHA)'
        required: false
        default: ''

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Compute tag
        run: echo "TAG=${TAG_INPUT:-single}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}
      - name: Deploy dev (VPS-2)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: TAG
          script: |
            cd /opt/xdiary/7-deploy
            bash update.sh "$TAG"
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo DEV_OK

  e2e-dev:
    needs: deploy-dev
    runs-on: ubuntu-latest
    steps:
      - name: Smoke dev (public /health)
        run: |
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://xdiary-vps2.taile0b6ee.ts.net/health || echo 000)
            if [ "$code" = "200" ]; then echo "DEV_OK"; exit 0; fi
            sleep 5
          done
          echo "DEV_FAILED"; exit 1

  deploy-prod:
    needs: e2e-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Compute tag
        run: echo "TAG=${TAG_INPUT:-single}" >> "$GITHUB_ENV"
        env:
          TAG_INPUT: ${{ inputs.tag }}
      - name: Deploy prod (VPS-1)
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: TAG
          script: |
            bash /home/deploy/update.sh "$TAG"
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo PROD_OK
