name: Deploy (dev → prod)

on:
  push:
    branches: [ main ]
    # Деплой — только на изменения кода/инфры. Чат, задачи, доки и .md не триггерят
    # полный конвейер dev→prod (раньше каждое сообщение в чате гоняло деплой).
    paths-ignore:
      - '5-tech-backlog/**'
      - '0*/**'
      - '01-user-stories/**'
      - '02-cjm/**'
      - '03-ddd/**'
      - '04-architecture/**'
      - 'app/**'
      - 'docs/**'
      - '*.md'
      # Любой .md в любой папке: иначе пуш доки (ранбук, ADR, ранбук APIM) гоняет
      # полный конвейер dev→prod и вытесняет из очереди настоящие деплои (§5.1).
      # 2026-11-10: очередь не пустела 10 проверок подряд именно из-за доков.
      - '**/*.md'
  workflow_dispatch:
    inputs:
      allow_prod_repair:
        description: 'РЕМОНТ: запустить deploy-prod несмотря на красный канон (прод нарушает контракт старыми образами)'
        type: boolean
        default: false
      reimport_apim:
        description: 'Ре-импорт openapi/*.json в Gravitee APIM (нужно после правки спек: APIM хранит определение у себя)'
        type: boolean
        default: false
      stop_before_prod:
        description: 'Остановиться до deploy-prod (dev + smoke-api + контракт журнала, без прода)'
        type: boolean
        default: false

# Один деплой за раз (несколько пушей агентов не гоняют параллельно).
concurrency:
  group: deploy-dev-prod
  cancel-in-progress: false

jobs:
  # DO-102 (2026-11-06): до деплоя проверяем, что теги из `images.lock` РЕАЛЬНО опубликованы.
  # Без этого класса проверки деплой падал на `podman pull` уже внутри `deploy.sh` (или, хуже,
  # молча поднимал старый `:single`), а «lock отстал от registry» никто не видел.
  # `rc=1` — есть отсутствующие (печатается список), `rc=2` — registry недоступен (не измерено).
  lock-published:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # `check_registry_tags --available` строит «последних опубликованных предков»
      # через `git log`; в мелком клоне истории нет → у всех сервисов «НЕТ опубликованных
      # предков» → красный гейт при верном lock (deploy #1974). Нужна полная история.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Самопроверка гейта
        run: python3 tools/gen_images_lock.py --selftest

      # 2026-11-11 (TE-093, критерий 5 «подключение в CI — зона @DO»):
      # инструмент @TE отвечает на вопрос «сколько из N тегов lock реально скачать».
      # `--selftest` — блокирующий (дешёвый, без сети: 5/5). `--available` — ОТЧЁТ, а не гейт:
      # на текущем lock он даёт rc=1 из-за `front` (у фронта нет образа в GHCR — он идёт через
      # Pages, а пакет отвечает 403 на анонимный pull-token). Блокировать этим нельзя: это
      # структурное «нет образа», а не «тег не опубликован». В `gen_images_lock.py` такой сервис
      # уже исключён по имени (`NO_REGISTRY_SERVICES`), здесь — тот же класс, но инструмент чужой.
      - name: Самопроверка check_registry_tags (@TE, TE-093)
        run: python3 9-tests/scripts/check_registry_tags.py --selftest

      # 2026-11-11 (TE-093 крит. 5, @TE 20:10): инструмент теперь различает «нет образа у front»
      # (норма: фронт идёт через Pages, пакет отвечает 403) и «пропал образ у любого другого
      # сервиса» (дефект) — `NO_REGISTRY_SERVICES` + `registry_rc()`. Поэтому шаг БЛОКИРУЮЩИЙ:
      # норма даёт rc=0 (проверено: 13 сервисов | доступно 12 | без образа 1 = front),
      # дефект — rc=1 (проверено подменой тега `journal` на несуществующий).
      - name: "Что реестр реально может дать (не-front без образа → красный)"
        run: |
          set -uo pipefail
          python3 9-tests/scripts/check_registry_tags.py --available
          rc=$?
          if [ "$rc" = "0" ]; then
            echo "::notice::реестр: все образы из lock доступны (front — Pages, не GHCR)"
          else
            echo "::error::реестр: check_registry_tags --available rc=$rc — образ из lock недоступен в реестре (список выше); это блокирует деплой"
          fi
          # DO-129 ч.2 (@TL 2026-11-13 19:5x): «не измерено» ≠ «нарушено». Если ПРОД лежит,
          # канон меряет именно прод и физически не может ответить — rc=2. При этом `deploy-prod`
          # требует success от этого джоба, то есть прод нельзя ПОЧИНИТЬ деплоем (замкнутый круг:
          # прогоны 43465238296, 43465975731). Отдаём признак наружу, чтобы ремонт стал возможен,
          # но джоб остаётся КРАСНЫМ: сигнал «не измерено» не закрашиваем.
          if [ "$rc" = "2" ]; then echo "reason=unmeasured" >> "$GITHUB_OUTPUT"; fi
          exit "$rc"

      - name: Все теги из images.lock опубликованы
        run: |
          set -uo pipefail
          set +e
          # 2026-11-10 (@TL 22:10): измеренный разрыв — **10.5 минуты** (#1856 11:26:02Z против
          # `ci-journal` #144 11:36:36Z), поэтому окно 5 минут класса НЕ закрывало. Ставим 15 минут
          # (30 попыток × 30 с) и печатаем список отсутствующих тегов на каждой попытке.
          # Долгосрочно правильнее `workflow_run` на завершение `ci-*` (деплой стартует ПОСЛЕ
          # публикации) — это следующий шаг, окно остаётся страховкой для ручных пушей.
          # НЕ закрашиваем: rc=1 после всех попыток — по-прежнему красный.
          for attempt in $(seq 1 30); do
            python3 tools/gen_images_lock.py --verify-registry
            rc=$?
            if [ "$rc" = "0" ]; then
              echo "::notice::lock-published: все теги доступны (попытка $attempt из 30)"
              exit 0
            fi
            echo "::warning::lock-published: попытка $attempt из 30 → rc=$rc (пауза 30 с)"
            [ "$attempt" -lt 30 ] && sleep 30
          done
          echo "::error::lock-published: теги недоступны после 30 попыток (~15 мин, rc=$rc) — список отсутствующих выше; это либо незавершённая сборка, либо реестр"
          exit "$rc"

  deploy-dev:
    needs: [lock-published]
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      # DO-066: тег берётся ТОЛЬКО из 7-deploy/images.lock (он в git) — ручного входа нет.
      # Правка 2026-11-04: гейт раньше проверял `/home/deploy/*` НА RUNNER'е (этих путей там
      # нет) — падал всегда и блокировал деплой (P0). Теперь: репозиторные скрипты здесь,
      # серверные — внутри ssh-шага, где они реально существуют.
      - name: Скрипты в репозитории — версия с отказом от тега (DO-066)
        run: |
          for f in 7-deploy/deploy.sh 7-deploy/update.sh; do
            if ! grep -q 'запрещено: тег задаётся только images.lock' "$f"; then
              echo "::error::$f без отказа от аргумента-тега (DO-066)"
              exit 1
            fi
          done
          echo "репозиторные скрипты: DO-066 применён"

      - name: Tag из images.lock
        run: |
          first="$(awk '!/^#/ && NF>=2 {print $2; exit}' 7-deploy/images.lock)"
          [ -n "$first" ] || { echo "::error::images.lock без тегов"; exit 1; }
          echo "TAG=$first" >> "$GITHUB_ENV"   # только для логов/проверки: update.sh читает lock сам
      # 2026-11-07 (@TL 08:52 вариант A): без доставки lock на сервер обновление НЕ применялось —
      # `update.sh` читает `/opt/xdiary/7-deploy/images.lock`, который никто не обновлял, и
      # пересоздавал контейнеры на старых тегах («deploy-dev success», а на dev `client=single-766e59e`).
      # Передаём содержимое lock и не-секретных скриптов через env (base64), не через git на сервере.
      - name: Lock и скрипты в env (base64)
        run: |
          set -euo pipefail
          echo "LOCK_B64=$(base64 -w0 7-deploy/images.lock)" >> "$GITHUB_ENV"
          echo "DEV_E2E_B64=$(base64 -w0 7-deploy/env/dev.e2e.env)" >> "$GITHUB_ENV"
          echo "UPDATE_B64=$(base64 -w0 7-deploy/update.sh)" >> "$GITHUB_ENV"
          echo "RECREATE_B64=$(base64 -w0 7-deploy/recreate-service.sh)" >> "$GITHUB_ENV"
          echo "LEGACY_B64=$(base64 -w0 7-deploy/legacy-shims.sh)" >> "$GITHUB_ENV"
          echo "GENHOSTS_B64=$(base64 -w0 tools/gen-hosts.py)" >> "$GITHUB_ENV"
          echo "SCHEMACHECK_B64=$(base64 -w0 tools/check_schema.py)" >> "$GITHUB_ENV"
      - name: Deploy dev (VPS-2)
        uses: appleboy/ssh-action@v1
        with:
          port: 8237
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: TAG,LOCK_B64,UPDATE_B64,RECREATE_B64
          script: |
            set -eu
            for f in /home/deploy/deploy.sh /home/deploy/update.sh; do
              grep -q 'запрещено: тег задаётся только images.lock' "$f" \
                || { echo "на VPS $f без DO-066 — поставь шим из 7-deploy/legacy-shims.sh"; exit 1; }
            done
            cd /opt/xdiary/7-deploy
            # применить lock и скрипты из репозитория (иначе деплой идёт по устаревшему lock)
            echo "$LOCK_B64" | base64 -d > images.lock
            echo "$UPDATE_B64" | base64 -d > update.sh
            echo "$RECREATE_B64" | base64 -d > recreate-service.sh
            chmod +x update.sh recreate-service.sh
            # dev-оверлей E2E: идемпотентно влить в secrets/.env (без дублей ключей)
            echo "$DEV_E2E_B64" | base64 -d > /tmp/dev.e2e.env
            python3 -c "import pathlib;env=pathlib.Path('secrets/.env');ov=pathlib.Path('/tmp/dev.e2e.env');lines=env.read_text(encoding='utf-8').splitlines() if env.exists() else [];keys={l.split('=',1)[0] for l in lines if '=' in l and not l.startswith('#')};add=[r for r in ov.read_text(encoding='utf-8').splitlines() if r.strip() and not r.lstrip().startswith('#') and r.split('=',1)[0] not in keys];env.write_text(chr(10).join(lines+add)+chr(10),encoding='utf-8') if add else None;env.chmod(0o600);print('dev-оверлей: добавлено ключей %d' % len(add))"
            echo "lock на VPS-2:"
            awk '!/^#/ && NF>=2 {printf "  %-20s %s\n", $1, $2}' images.lock | head -13
            grep -q 'tag_of' update.sh || { echo "::error::update.sh без tag_of"; exit 1; }
            grep -q 'images.lock' recreate-service.sh || { echo "::error::recreate-service.sh без lock"; exit 1; }
            bash update.sh
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo DEV_OK

  # DO-035: гейт выбирается по природе изменения, а не «один на всё».
  # Считаем, что именно поменялось в пуше: бэкенд/инфра (6-msa, 7-deploy) → api,
  # фронт (8-front) → front. Если непонятно/смешано — требуем оба гейта.
  diff-paths:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.d.outputs.api }}
      front: ${{ steps.d.outputs.front }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: d
        run: |
          set -euo pipefail
          # DO-050: раньше `git diff ... || true` превращал ОШИБКУ diff в пустой
          # список, а пустой список = «изменений нет» → деплой молча пропускался.
          if ! base="$(git rev-parse HEAD~1 2>/dev/null)"; then
            echo "::error::diff-paths: не могу определить HEAD~1 — считаю, что изменилось всё"
            changed="ALL"
          elif ! changed="$(git diff --name-only "$base" HEAD 2>/dev/null)"; then
            echo "::error::diff-paths: git diff упал — не отличаю «нет изменений» от ошибки"
            exit 1
          fi
          echo "=== changed files ==="
          echo "$changed"
          api=false; front=false
          if echo "$changed" | grep -qE '^(6-msa|7-deploy)/'; then api=true; fi
          if echo "$changed" | grep -qE '^8-front/'; then front=true; fi
          # ничего не распознали (например workflow_dispatch) — требуем оба гейта
          if [ "$api" = false ] && [ "$front" = false ]; then api=true; front=true; fi
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "front=$front" >> "$GITHUB_OUTPUT"
          echo "api=$api front=$front"

  # TE-022 / ADR-020 п.3 — блокирующий API-гейт (health + интеграционные API-тесты).
  smoke-api:
    needs: deploy-dev
    runs-on: ubuntu-latest
    # DO-129 ч.2 (@TL): выход нужен, чтобы `deploy-prod` мог поехать РЕМОНТОМ,
    # когда канон не смог измерить прод (rc=2). Без объявления на уровне джоба
    # `needs.smoke-api.outputs.reason` всегда пуст — именно на этом первый вариант
    # патча №28 и не сработал (прогон 43467346514: deploy-prod skipped).
    outputs:
      reason: ${{ steps.canon.outputs.reason }}
    env:
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
      # @TL 2026-11-06 00:01: канон входа измеряется по ПРОД-базе: на dev `via=yarp`
      # (APIM не в пути) и канон честно даёт rc=2, то есть гейт был бы «не измерен» всегда.
      XDIARY_PROD_BASE_URL: https://xdiary-vps1.taile0b6ee.ts.net
      XDIARY_E2E_PIN: "1234"
    steps:
      - name: Check dev /health
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://xdiary-vps2.taile0b6ee.ts.net/health || echo 000)
            if [ "$code" = "200" ]; then echo "DEV_HEALTH_OK"; exit 0; fi
            sleep 5
          done
          echo "DEV_HEALTH_FAILED"; exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # @TL 2026-11-05 22:46 (PATCHES.md п.1): шаг звал несуществующий
      # `9-tests/E2E/E2E.Tests/E2E.IntegrationTests.csproj` (MSB1009) и блокировал deploy-prod.
      # Заменён на ИЗМЕРЕНИЕ канона входа: 74/74 + 2/2, via=gravitee, rc=0/2/1.
      - name: API-канон входа (measure, не заглушка)
        id: canon
        run: |
          set -uo pipefail
          # 2026-11-10 (@DO): в #1801 канон дал 73/74 и rc=2 из-за ОДНОЙ пробы без ответа
          # (unknown_retried=6), а локальный повтор того же замера — 74/74, rc=0. Это флейк пробы,
          # но rc=2 обязан оставаться красным (канон: «не измерено»), поэтому не закрашиваем,
          # а даём ВТОРУЮ попытку и печатаем обе: rc=1 → сразу fail; rc=2 → пауза 15 с и повтор;
          # rc=2 дважды → fail «не измерено дважды»; rc=2→0 → notice «первый был флейком».
          # @TL 23:10 (`1503`): таймаут НЕ поднимаем — иначе гейт перестанет ловить настоящие зависания.
          # Честнее повтор ВНУТРИ пробы: `--retry-unknown 3` — при отсутствии ответа проба повторяется,
          # и медленный первый ответ (4.77 с у `analytics/summary`, 6.66 с у `clients/me`) не превращается
          # в «не измерено». Предел пробы НЕ поднимаем и в тексте его не фиксируем: значение
          # берётся из `check_apim_auth.PROBE_TIMEOUT` и печатается (см. `TW=` ниже), иначе
          # комментарий снова начнёт врать при смене дефолта (@AR 15:32).
          # @AR 15:32 (`1040`): число в сообщении должно ПРИХОДИТЬ ИЗ КОДА, а не быть вписанным.
          # Я уже наступил на это: печатал «таймаут 15 с», а вызов шёл с дефолтом 8 с.
          TW=$(python -c "import sys; sys.path.insert(0,'9-tests/scripts'); import check_apim_auth as c; print(c.PROBE_TIMEOUT)" 2>/dev/null || echo "?")
          echo "::notice::канон: предел пробы ${TW} с (из check_apim_auth.PROBE_TIMEOUT), ретраев на unknown: 3"
          T0=$SECONDS
          python 9-tests/scripts/check_apim_auth.py --all --base "$XDIARY_PROD_BASE_URL" --retry-unknown 3; rc=$?
          echo "::notice::канон (попытка 1): rc=$rc за $((SECONDS - T0)) с (предел пробы ${TW} с, из кода)"
          if [ "$rc" = "2" ]; then
            echo "::warning::канон вернул rc=2 (не измерено) — повтор через 15 с"
            # @AR 12:34: «заметка о rc=2 не равна исправлению» — печатаем ЧАСТОТУ, а не разовое событие.
            {
              echo "### smoke-api: rc=2 (не измерено)"
              echo
              echo "прогон $GITHUB_RUN_ID: попытка 1 дала rc=2 → был повтор через 15 с"
              echo "частота за прошлые прогоны: см. workflow \`canon-stability\` (ночной счётчик повторов)"
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            sleep 15
            T1=$SECONDS
            python 9-tests/scripts/check_apim_auth.py --all --base "$XDIARY_PROD_BASE_URL" --retry-unknown 3; rc=$?
            echo "::notice::канон (попытка 2): rc=$rc за $((SECONDS - T1)) с"
            [ "$rc" = "0" ] && echo "::notice::повтор канона дал rc=0 — первый прогон был флейком пробы"
          fi
          if [ "$rc" = "2" ]; then
            echo "::error::канон входа: не измерено ДВАЖДЫ (rc=2) — это не «зелено» и не «нарушитель»"
          fi
          exit "$rc"
      # 2026-11-05 (@DO): путь `9-tests/Contract.ClientJournal` в репозитории ОТСУТСТВУЕТ
      # (в `9-tests/` только RnD/reports/scripts) — тот же класс, что мёртвый E2E-путь выше.
      # Не удаляю и не закрашиваю: печатаю «не измерено» и выхожу rc=2; проект выбирает @TE.
      # @TL 2026-11-06 (DO-100 п.5): заглушка `exit 2` заменена РЕАЛЬНЫМ прогоном
      # существующего контракта Client↔Partners↔Journal: Journal.ApiTests → PartnerSoftDelete
      # ([ApiFact] + E2ESession + HttpClient: POST /partners, GET /partners, POST …/remove,
      # инвариант HistoryStaysResolvable). `XDIARY_E2E_BASE_URL` уже задан выше, значит тест
      # выполняется, а не скипается. Пока `remove` отдаёт 400 — шаг честно КРАСНЫЙ.
      - name: "Контракт журнала (Journal.ApiTests → PartnerSoftDelete)"
        run: |
          dotnet test 6-msa/BC-Journal/src/Journal.ApiTests/Journal.ApiTests.csproj \
            --filter "FullyQualifiedName~PartnerSoftDelete" \
            --verbosity minimal
  # Браузерный гейт: только фронт. Отдельный джоб, чтобы фронтовый баг не блокировал
  # доставку бэкенда (DO-035).
  # @TL 2026-11-07 08:26 п.(2): «постоянный красный перестаёт быть сигналом (§5.4/§8)» —
  # поэтому приёмка BE-092 живёт ОТДЕЛЬНЫМ отчётным job'ом, а не шагом внутри `smoke-api`:
  # её красный не отменяет `deploy-prod` и не смешивается с реальными смоуками.
  #
  # Условие промоушена в блокирующие (снять `continue-on-error`): день первого прогона, где
  # контракт dev выполнен целиком — `200` без `delivery` (тестовый OTP) + `409`+`clientId` + `429`.
  # Владелец условия — @DO; проверка — `check_be092_delivery.py --mode test-otp` (просит у @TE
  # `chat/do.md` 2026-11-07 08:49). До этого — отчёт: видно квитанцию, но зелёный/красный
  # этого job'а не влияет на выкатку.
  # @TE 2026-11-07 09:05: бери обёртку — она сама даёт `0`/`1`/`2` → код шага
  # (`2` не валит, `--require-measured` делает `2` красным). `--mode test-otp`: на dev
  # при `TESTOTP` поля `delivery` нет по замыслу, ожидание — `200` без `delivery` +
  # `409`+`clientId` + `429`. Обёртка выдерживает окно лимитера (`--limit-wait` 62 с),
  # поэтому прогон ~65 с — норма.
  #
  # Условие промоушена в блокирующие (снять `continue-on-error` и добавить этот job в
  # `needs` `deploy-prod`) — первый прогон, где контракт dev выполнен целиком (0), см. `DO-112`.
  receipt-be092:
    # DO-121 ч.1 (@TL 2026-11-13 00:39): без этого `receipt-be092` шёл ПАРАЛЛЕЛЬНО со
    # `smoke-front`, и его проба (test-otp: 200/409/429) гонялась с очисткой стенда —
    # отсюда «старый образ» и ложные 404. Ставим после `smoke-front`: гонка уходит классом.
    needs: [deploy-dev, smoke-front]
    runs-on: ubuntu-latest
    env:
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
    steps:
      - uses: actions/checkout@v4
      - name: "Квитанция BE-092 на dev (тестовый OTP: 200 без delivery + 409+clientId + 429)"
        run: |
          python 9-tests/scripts/ci_be092_delivery_step.py \
            --base "$XDIARY_E2E_BASE_URL" --mode test-otp

  smoke-front:
    needs: deploy-dev
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      XDIARY_E2E_BASE_URL: http://127.0.0.1:8080
      # @TL 2026-11-06 00:01: канон входа измеряется по ПРОД-базе: на dev `via=yarp`
      # (APIM не в пути) и канон честно даёт rc=2, то есть гейт был бы «не измерен» всегда.
      XDIARY_PROD_BASE_URL: https://xdiary-vps1.taile0b6ee.ts.net
      XDIARY_E2E_PIN: "1234"
    steps:
      - uses: actions/checkout@v4
      - name: Подготовить скрипт очистки (base64 для доставки на стенд)
        run: |
          # 2026-11-10: «нет скрипта на стенде» больше не повод пропускать очистку —
          # доставляем файл из этого же коммита (см. шаг ниже).
          echo "CLEANUP_SCRIPT_B64=$(base64 -w0 7-deploy/cleanup-e2e-dev.sh)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: 9-tests/RnD/front-e2e
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright install --with-deps chromium

      # 2026-11-07: транспорт до dev без tailnet — SSH-туннель 127.0.0.1:8080 -> VPS-2.
      # Раннер GitHub не в tailnet: браузер получал `Failed to fetch` на /clients/me,
      # из-за чего падали partner-edit/csv/wizard (и это выглядело дефектом фронта).
      # 2026-11-10 (@DO): `smoke-front` падал на `add-partner` не из-за фронта, а из-за ГРЯЗНОГО
      # стенда: в `#partners-list` лежал чужой партнёр (`TTE-SEED-…`), а созданного тестом в списке
      # ещё не было. У `front-e2e-repeat` очистка есть, у `smoke-front` — не было. Добавляем ту же:
      # скрипт чистит только тестовые телефоны (`+7999…`) и печатает отчёт «до/после».
      - name: Очистить накопленные E2E-данные на dev (DO-044)
        uses: appleboy/ssh-action@v1
        env:
          CLEANUP_B64: ${{ env.CLEANUP_SCRIPT_B64 }}
        with:
          port: 8237
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          envs: CLEANUP_B64
          script: |
            # 2026-11-10 (@DO): скрипт в репозитории, но на стенде его может не быть — тогда
            # «очистка» молча пропускалась (warning в #1871). Доставляем его сами, из текущего
            # коммита: base64 -> /tmp -> bash. Так очистка не зависит от того, что успел выкатить
            # deploy-dev, и «нет скрипта» перестаёт быть нормой.
            if [ -n "${CLEANUP_B64:-}" ]; then
              echo "$CLEANUP_B64" | base64 -d > /tmp/cleanup-e2e-dev.sh
              SCRIPT=/tmp/cleanup-e2e-dev.sh
              echo "::notice::очистка: скрипт доставлен из коммита ($(wc -l < "$SCRIPT") строк)"
            else
              SCRIPT=/opt/xdiary/7-deploy/cleanup-e2e-dev.sh
            fi
            if [ ! -f "$SCRIPT" ]; then
              echo "::warning::скрипт очистки не найден ни в коммите, ни на стенде — прогон без очистки"
              exit 0
            fi
            bash "$SCRIPT" | tail -12
            bash "$SCRIPT" --apply --clients | tail -12

      - name: Туннель к dev (127.0.0.1:8080)
        env:
          DEV_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/dev_key
          printf '%s\n' "$DEV_KEY" > /tmp/dev_key
          ssh -p 8237 -i /tmp/dev_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ExitOnForwardFailure=yes -f -N -L 8080:127.0.0.1:8080 "$DEV_USER@$DEV_HOST"
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health >/dev/null; then
              echo "туннель поднят, /health отвечает (попытка $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::туннель не отвечает: /health через 127.0.0.1:8080 недоступен"; exit 1
      # @TL 2026-11-13 11:47 (предложение по зоне @DO): `/health` идёт МИМО API (Caddy отвечает
      # сам), поэтому зелёный `/health` не означает «API поднялся». Из-за этого `smoke-front`
      # краснел на 502 от `/api/v1/clients`, а красный `smoke-front` гасил `receipt-be092` через
      # `needs` — то есть один неготовый API стоил целого цикла. Ждём готовность API по факту:
      # любой код, кроме 5xx/000 (200 и 401 одинаково означают «сервис отвечает»).
      # TE-110 / @TL 2026-11-13 11:4x: между `deploy-dev` и готовностью сервиса есть окно, когда
      # Caddy уже отдаёт `/health`, а сервис ещё пересоздаётся → `/api/v1/clients` = 502.
      # Замер: `front-e2e-repeat` на `main` (`add-partner`, repeat=3) — 1 passed / 2 failed с
      # «Вход не завершился … http 502». Красный `smoke-front` гасит `receipt-be092` через `needs`,
      # поэтому ждём НЕ `/health` (его отдаёт Caddy, мимо API), а сам API без 5xx.
      # Проверяем ДВА пути: `/clients` (401 анонимно) и `/clients/me` (401 — «сервис жив», токен не нужен).
      # Готово только когда ОБА не 5xx/000 — иначе окно пересоздания одной реплики ещё открыто.
      - name: Готовность API dev (не 5xx на /clients, /clients/me и POST /clients)
        run: |
          set -uo pipefail
          last=""
          for i in $(seq 1 60); do
            c1="$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/api/v1/clients 2>/dev/null || true)"
            c2="$(curl -s -o /dev/null -m 5 -w '%{http_code}' http://127.0.0.1:8080/api/v1/clients/me 2>/dev/null || true)"
            # DO-125/ч.2 (@TL 2026-11-13 18:0x): `GET /clients` и `GET /clients/me` отвечает
            # ШЛЮЗ (401 до авторизации), поэтому проба зеленела, пока сам сервис clients лежал.
            # Замер: прогон 43447361176, job 131962378438 — `POST /clients {phone: …54} → 502`;
            # `smoke-api` там же дал rc=2 «не измерено ДВАЖДЫ». Проба ниже доходит ДО сервиса:
            # пустое тело → ожидаем 400 (валидация из сервиса), а не 502.
            c3="$(curl -s -o /dev/null -m 5 -w '%{http_code}' -X POST \
                 -H 'Content-Type: application/json' -d '{}' \
                 http://127.0.0.1:8080/api/v1/clients 2>/dev/null || true)"
            c1="${c1:-000}"; c2="${c2:-000}"; c3="${c3:-000}"
            last="clients=$c1 clients/me=$c2 POST/clients=$c3"
            case "$c1" in 5*|000) echo "  попытка $i: $last — шлюз ещё не готов"; sleep 3; continue ;; esac
            case "$c2" in 5*|000) echo "  попытка $i: $last — шлюз ещё не готов"; sleep 3; continue ;; esac
            case "$c3" in 5*|000) echo "  попытка $i: $last — сервис clients ещё поднимается"; sleep 3; continue ;; esac
            echo "::notice::API dev готов: $last (попытка $i; 401 = шлюз жив, 400 = сервис clients жив)"
            exit 0
          done
          echo "::error::dev API не поднялся за 180 с ($last) — это инфраструктура, а не дефект фронта"
          exit 1
      # DO-099 (@TL 2026-11-13 01:34): `check_otp_leak` был сиротой — не запускался нигде.
      # Его место здесь: после `deploy-dev` туннель 127.0.0.1:8080 уже поднят, и утечку OTP
      # в ответах видно на живом контуре. В `ci-guards` он бессмысленен (нет стенда -> rc=2).
      - name: Утечка OTP в ответах (check_otp_leak)
        run: |
          set -uo pipefail
          python 9-tests/scripts/check_otp_leak.py --selftest
          python 9-tests/scripts/check_otp_leak.py --base http://127.0.0.1:8080 \
            --contract 04-architecture/api-index.yaml

      - name: UI smoke (add-partner, wizard-record, change-pin)
        working-directory: 9-tests/RnD/front-e2e
        run: |
          set -o pipefail
          mkdir -p test-results
          npx playwright test add-partner wizard-record change-pin --trace on 2>&1 | tee test-results/pw.log

      # 2026-11-07: у падений E2E не было артефактов (`artifacts: 0` в #1785), поэтому
      # разбор шёл по строкам лога, а не по DOM/сети. Теперь трассы поднимаются всегда.
      - name: Артефакты падения (trace, скриншоты, error-context)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-failure-${{ github.run_id }}
          path: |
            9-tests/RnD/front-e2e/test-results
            9-tests/RnD/front-e2e/playwright-report
          retention-days: 7
          # DO-120 (@TL 2026-11-13 00:24): этот вход был ОШИБОЧНО вставлен внутрь `run:` шага
          # «Классы падений» → `line 2: if-no-files-found:: command not found` → exit 127 →
          # красный smoke-front на каждом прогоне → deploy-prod skipped.
          if-no-files-found: ignore

      # 2026-11-10 (@TE 11:45): у @TE нет доступа к артефактам и к контуру, поэтому классы
      # падений печатаются прямо в лог прогона — без скачивания.
      - name: Классы падений (e2e_triage)
        if: failure()
        run: |
          python 9-tests/scripts/e2e_triage.py --input 9-tests/RnD/front-e2e/test-results/pw.log || true

  deploy-prod:
    # DO-035: бэкенд-пуш доезжает до прода, даже если красный фронтовый гейт —
    # при условии, что фронт в этом пуше не менялся и smoke-api зелёный.
    needs: [smoke-api, smoke-front, diff-paths, receipt-be092]
    if: |
      (!inputs.stop_before_prod) &&
      always() &&
      (needs.smoke-api.result == 'success' || needs.smoke-api.outputs.reason == 'unmeasured' || inputs.allow_prod_repair) &&
      (needs.smoke-front.result == 'success' || needs.diff-paths.outputs.front != 'true')
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # 2026-11-07: у job'а НЕ БЫЛО checkout — `7-deploy/images.lock` в workspace отсутствовал,
      # и шаг падал с `awk: cannot open file '7-deploy/images.lock'`, из-за чего prod не выкатывался.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # DO-066: тег берётся ТОЛЬКО из 7-deploy/images.lock (он в git) — ручного входа нет.
      - name: Tag из images.lock
        run: |
          first="$(awk '!/^#/ && NF>=2 {print $2; exit}' 7-deploy/images.lock)"
          [ -n "$first" ] || { echo "::error::images.lock без тегов"; exit 1; }
          echo "TAG=$first" >> "$GITHUB_ENV"   # только для логов/проверки: update.sh читает lock сам
      # DO-124: на VPS-1 скрипты НЕ доставлялись (base64-шаг был только в deploy-dev),
      # поэтому там оставалась копия update.sh от старого релиза — отсюда
      # «update.sh:59: say: command not found» и расхождение sha256 с эталоном шима.
      - name: Lock и скрипты в env (base64) — прод
        run: |
          set -euo pipefail
          echo "LOCK_B64=$(base64 -w0 7-deploy/images.lock)" >> "$GITHUB_ENV"
          echo "UPDATE_B64=$(base64 -w0 7-deploy/update.sh)" >> "$GITHUB_ENV"
          echo "RECREATE_B64=$(base64 -w0 7-deploy/recreate-service.sh)" >> "$GITHUB_ENV"
          # DO-124 ч.2: шим `/home/deploy/update.sh` падал на своём стороже ДО вызова живого
          # скрипта, потому что `legacy-shims.sh` на VPS-1 отсутствовал. envs уже расширены
          # до LEGACY_B64, но сама переменная не готовилась — на стенд уходила пустая строка,
          # и шаг падал на `grep 'запрещено: тег задаётся только images.lock'`.
          echo "LEGACY_B64=$(base64 -w0 7-deploy/legacy-shims.sh)" >> "$GITHUB_ENV"
          echo "GENHOSTS_B64=$(base64 -w0 tools/gen-hosts.py)" >> "$GITHUB_ENV"
          echo "APIMIMPORT_B64=$(base64 -w0 7-deploy/apim/import.sh)" >> "$GITHUB_ENV"
          echo "OPENAPI_B64=$(tar -czf - openapi | base64 -w0)" >> "$GITHUB_ENV"
          echo "SCHEMACHECK_B64=$(base64 -w0 tools/check_schema.py)" >> "$GITHUB_ENV"
          # DO-124 ч.4: сторож `update.sh` (DO-050) сравнивает `CODE_TS` с датой сборки образов
          # и останавливает деплой «образ старше кода». Брать `github.event.head_commit.timestamp`
          # нельзя: правка в `7-deploy/`/`.github/` не пересобирает образы, но выглядит
          # «код новее образов» — прод вставал на каждом инфраструктурном коммите.
          # Только `6-msa`: `8-front` — статика PWA (Pages), в образы контейнеров НЕ входит.
          # С `8-front` в пути `CODE_TS` = время фронт-коммита, и сторож сравнивал его с
          # образами бэкенда — ложное «образы старше кода» (run #2038: `код 13:39`
          # при последнем коммите 6-msa `02:52`).
          code_ts="$(git log -1 --format=%cI -- 6-msa 2>/dev/null || true)"
          [ -n "$code_ts" ] || code_ts="$(git log -1 --format=%cI)"
          echo "CODE_TS=$code_ts" >> "$GITHUB_ENV"
          echo "CODE_TS (по коду, не по инфре): $code_ts"
      - name: Deploy prod (VPS-1)
        uses: appleboy/ssh-action@v1
        env:
          ALLOW_PROD_REPAIR: ${{ inputs.allow_prod_repair }}
          REIMPORT_APIM: ${{ inputs.reimport_apim }}
        with:
          port: 8237
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: TAG,CODE_TS,LOCK_B64,UPDATE_B64,RECREATE_B64,LEGACY_B64,GENHOSTS_B64,ALLOW_PROD_REPAIR,SCHEMACHECK_B64,APIMIMPORT_B64,OPENAPI_B64,REIMPORT_APIM
          script: |
            if [ "${ALLOW_PROD_REPAIR:-false}" = "true" ]; then
              echo "::warning::РЕМОНТ ПРОДА: канон красный, deploy-prod запущен принудительно (allow_prod_repair=true) — осознанный выход из замкнутого круга: старые образы нарушают контракт, починить их можно только выкаткой"
            fi
            set -euo pipefail
            # DO-129 ч.3 (@TL 2026-11-13 20:2x): ремонт обязан ТЕРПЕТЬ то состояние, которое лечит.
            # В прогоне 43471272718 прод-джоб впервые поехал (break-glass сработал), но умер на preflight:
            # `APIM gateway: /api/v1/catalog = 200 (ожидали 401)` — старый APIM отдаёт каталог анонимно,
            # это ровно те нарушители, которых и лечим. При allow_prod_repair вход проверяем, но не блокируем.
            fail_or_warn() {
              if [ "${ALLOW_PROD_REPAIR:-false}" = "true" ]; then
                echo "::warning::РЕМОНТ: $*"
              else
                echo "::error::$*"
                exit 1
              fi
            }
            # AR-160 (@TL 2026-11-13 23:4x): APIM хранит определение API у себя, поэтому правка
            # `openapi/*.json` в git НЕ влияет на живой шлюз. После смены спек нужен ре-импорт.
            # Делаем это по явному входу `reimport_apim` (default false), чтобы не плодить API
            # на каждом обычном деплое.
            if [ "${REIMPORT_APIM:-false}" = "true" ]; then
              echo "APIM-REIMPORT: доставляю openapi/*.json и import.sh, затем ре-импорт"
              mkdir -p /opt/xdiary/openapi /opt/xdiary/7-deploy/apim
              echo "$APIMIMPORT_B64" | base64 -d > /opt/xdiary/7-deploy/apim/import.sh
              chmod +x /opt/xdiary/7-deploy/apim/import.sh
              tar -xzf - -C /opt/xdiary <<< "$(printf %s "$OPENAPI_B64" | base64 -d)" || fail_or_warn "APIM-REIMPORT: не удалось распаковать openapi/*.json"
              if bash /opt/xdiary/7-deploy/apim/import.sh; then
                echo "APIM-REIMPORT: ре-импорт выполнен"
              else
                fail_or_warn "APIM-REIMPORT: import.sh вернул ошибку — API в шлюзе могли остаться прежними"
              fi
            fi
            # GUARD по DLL СНЯТ 2026-11-10 (@TL 11:45): условия выполнены и проверены
            # фактом на проде — образ `client` rev `ab2eeb31`: `link-partner` = 1,
            # `me/profile` = 1, контрольная `api/v1/clients` = 1; `GET /clients` закрыт
            # и в сервисе (@BE `41069c3e`), и в шлюзе (ADR-026). Метод и условие
            # возврата — `7-deploy/runbooks/release-gate.md` §7.
            # ВЕРНУТЬ, если E7 уберёт шим `link-partner`: тогда проверка снова нужна,
            # иначе на прод уедет образ без переходного поведения.
            # DO-050: передаём время коммита, чтобы update.sh мог проверить
            # «образ не старше кода» — иначе success означает «не тот код».
            # DO-076 (вопрос владельца 2026-11-05): APIM стоит В ПУТИ трафика
            # (Funnel -> Caddy:8081 -> APIM:18082), но `/health` идёт МИМО APIM —
            # поэтому прежний smoke `curl /health` оставался зелёным даже при мёртвом
            # APIM, а публичный API вернул бы 404/502. Pre-flight: не выкатываем в
            # сломанный вход.
            for c in xdiary-apim-gateway xdiary-apim-management xdiary-apim-ui xdiary-apim-mongo; do
              s="$(podman inspect "$c" --format '{{.State.Status}}' 2>/dev/null || echo missing)"
              [ "$s" = "running" ] || fail_or_warn "APIM: $c = $s (ожидали running) — деплой остановлен"
            done
            g="$(curl -s -o /dev/null -w '%{http_code}' -m 8 http://127.0.0.1:18082/api/v1/catalog)"
            [ "$g" = "401" ] || fail_or_warn "APIM gateway: /api/v1/catalog = $g (ожидали 401) — деплой остановлен"
            echo APIM_PREFLIGHT_OK
            # DO-124: привести скрипты на VPS-1 к версии из git ДО вызова update.sh.
            # Шим /home/deploy/update.sh делегирует в /opt/xdiary/7-deploy/update.sh —
            # именно там лежала устаревшая копия (say: command not found).
            cd /opt/xdiary/7-deploy
            echo "$LOCK_B64" | base64 -d > images.lock
            echo "$UPDATE_B64" | base64 -d > update.sh
            echo "$RECREATE_B64" | base64 -d > recreate-service.sh
            chmod +x update.sh recreate-service.sh
            grep -q 'tag_of' update.sh || { echo "::error::update.sh без tag_of — доставка не удалась"; exit 1; }
            grep -q 'say()' update.sh || { echo "::error::update.sh без say() — та же устаревшая копия"; exit 1; }
            echo "DO-124: скрипты обновлены из git (update.sh $(wc -l < update.sh) строк)"
            # шимы /home/deploy/*.sh пересоздаём детерминированно: их sha256-эталон
            # считается от сгенерированного текста, поэтому после этого сходится.
            # DO-124 ч.2 (@TL 2026-11-13 12:1x): `legacy-shims.sh` на VPS-1 отсутствовал, поэтому
            # шим `/home/deploy/update.sh` оставался старым и падал на своём же
            # стороже «разошёлся со снимком» (sha256 9173778a != 7b62a233) ДО вызова живого скрипта.
            # Доставляем его из git и пересоздаём шимы детерминированно.
            [ -n "${LEGACY_B64:-}" ] || { echo "::error::LEGACY_B64 пуст — шаг подготовки не передал legacy-shims.sh"; exit 1; }
            # DO-129 (@TL): `gen-hosts.py` НЕ доставлялся на VPS-1, поэтому список
            # `--add-host` там отличался от dev (в прогоне 43455070581 у journal вышло
            # «11 хостов» против 10 на dev). Генератор должен быть один и тот же.
            mkdir -p /opt/xdiary/tools
            [ -n "${GENHOSTS_B64:-}" ] || { echo "::error::GENHOSTS_B64 пуст — шаг подготовки не передал tools/gen-hosts.py"; exit 1; }
            echo "$GENHOSTS_B64" | base64 -d > /opt/xdiary/tools/gen-hosts.py
            # DO-131 (@TL 2026-11-13 22:5x): `check_schema.py` — гейт расхождения схемы
            # (сравнивает `Migrations/` в коде с `__EFMigrationsHistory` в БД). В `update.sh`
            # он вызывается по пути `/opt/xdiary/tools/check_schema.py`, но на VPS-1 этот файл
            # НИКОГДА не доставлялся — значит проверка молча пропускалась (`[ -f ]` → нет файла),
            # и мы не видели, что схема БД отстала от новых образов (класс 27×500).
            [ -n "${SCHEMACHECK_B64:-}" ] || { echo "::error::SCHEMACHECK_B64 пуст — шаг подготовки не передал tools/check_schema.py"; exit 1; }
            echo "$SCHEMACHECK_B64" | base64 -d > /opt/xdiary/tools/check_schema.py
            echo "DO-131: check_schema.py доставлен из git ($(wc -l < /opt/xdiary/tools/check_schema.py) строк)"
            echo "DO-129: gen-hosts.py доставлен из git ($(wc -l < /opt/xdiary/tools/gen-hosts.py) строк)"
            # BE-115 (@TL 2026-11-13 21:4x): 26 из 51 нарушителей контракта на проде — это
            # `Jwt__SigningKey`. `JwtSigningKey.Resolve` вызывается внутри `AddJwtBearer(...)`,
            # то есть на КАЖДОЙ проверке токена: если ключа нет, защищённый эндпоинт отвечает
            # 500 вместо 401 (проверено: GET /api/v1/journal/records → 500).
            # Проверяем НАЛИЧИЕ и базовую валидность ключа, ЗНАЧЕНИЕ НЕ ПЕЧАТАЕМ никогда.
            # Путь уточнён по факту: в прогоне 43481204653 проверка сказала
            # «/opt/xdiary/secrets/.env не найден», хотя сервисы поднимаются — значит
            # `deploy.sh` берёт `--env-file secrets/.env` из СВОЕГО каталога
            # (`/opt/xdiary/7-deploy`). Проверяем оба кандидата плюс окружение живого
            # контейнера (только НАЛИЧИЕ ключа, значение не печатаем никогда).
            ENVFILE=""
            for cand in /opt/xdiary/7-deploy/secrets/.env /opt/xdiary/secrets/.env; do
              [ -f "$cand" ] && { ENVFILE="$cand"; break; }
            done
            if [ -z "$ENVFILE" ]; then
              echo "BE-115: файл .env не найден ни в /opt/xdiary/7-deploy/secrets, ни в /opt/xdiary/secrets"
            else
              echo "BE-115: файл окружения — $ENVFILE"
            fi
            if [ -n "$ENVFILE" ] && grep -q '^Jwt__SigningKey=' "$ENVFILE" 2>/dev/null; then
              kv="$(grep -m1 '^Jwt__SigningKey=' "$ENVFILE" | cut -d= -f2- | tr -d '\r')"
              if [ "${#kv}" -ge 32 ] && printf '%s' "$kv" | base64 -d >/dev/null 2>&1; then
                echo "BE-115: Jwt__SigningKey в $ENVFILE есть и валиден (len=${#kv})"
              else
                fail_or_warn "BE-115: Jwt__SigningKey в $ENVFILE есть, но НЕ валиден (len=${#kv}) — защищённые эндпоинты отдадут 500 вместо 401"
              fi
            fi
            # независимая проверка: попал ли ключ в ЖИВОЙ контейнер (считаем только наличие)
            if podman container exists xdiary-journal 2>/dev/null; then
              has="$(podman inspect xdiary-journal --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep -c '^Jwt__SigningKey=' || true)"
              if [ "${has:-0}" -ge 1 ]; then
                echo "BE-115: в окружении xdiary-journal Jwt__SigningKey ПРИСУТСТВУЕТ"
              else
                fail_or_warn "BE-115: в окружении xdiary-journal ОТСУТСТВУЕТ Jwt__SigningKey — поэтому 500 вместо 401"
              fi
            fi
            if [ -f /opt/xdiary/secrets/.env ]; then
              if grep -q '^Jwt__SigningKey=' /opt/xdiary/secrets/.env; then
                kv="$(grep -m1 '^Jwt__SigningKey=' /opt/xdiary/secrets/.env | cut -d= -f2- | tr -d '\r')"
                if [ "${#kv}" -ge 32 ] && printf '%s' "$kv" | base64 -d >/dev/null 2>&1; then
                  echo "BE-115: Jwt__SigningKey есть и валиден как base64 (длина ${#kv})"
                else
                  fail_or_warn "BE-115: Jwt__SigningKey есть, но НЕ валиден (len=${#kv}, base64-декод не прошёл) — защищённые эндпоинты будут отдавать 500 вместо 401"
                fi
              else
                fail_or_warn "BE-115: в /opt/xdiary/secrets/.env НЕТ Jwt__SigningKey — защищённые эндпоинты будут отдавать 500 вместо 401"
              fi
            else
              echo "BE-115: /opt/xdiary/secrets/.env не найден — пропускаю проверку ключа"
            fi
            echo "$LEGACY_B64" | base64 -d > legacy-shims.sh
            [ -s legacy-shims.sh ] || { echo "::error::legacy-shims.sh пуст после декода — base64 повреждён"; exit 1; }
            chmod +x legacy-shims.sh
            grep -q 'запрещено: тег задаётся только images.lock' legacy-shims.sh \
              || { echo "::error::legacy-shims.sh без DO-066 — доставка не удалась"; exit 1; }
            bash legacy-shims.sh >/dev/null
            echo "DO-124: шимы пересозданы из git (legacy-shims.sh)" 
            bash /home/deploy/update.sh
            sleep 20
            curl -fsS http://127.0.0.1:8080/health && echo PROD_OK

            # DO-076: `/health` идёт мимо APIM, поэтому он НЕ доказывает, что публичный
            # вход жив. Проверяем сам публичный путь: 401 (а не 404/502) + x-gravitee.
            ph="$(curl -sS -D /tmp/pub_hdr.txt -o /dev/null -w '%{http_code}' -m 8 \
                  -H 'Host: xdiary-vps1.taile0b6ee.ts.net' http://127.0.0.1:8081/api/v1/catalog)"
            [ "$ph" = "401" ] || fail_or_warn "публичный вход: /api/v1/catalog = $ph (ожидали 401; 404 = APIM без маршрута, 502 = APIM мёртв)"
            grep -qi 'x-gravitee' /tmp/pub_hdr.txt || { echo "::error::публичный вход без x-gravitee — трафик идёт МИМО APIM"; exit 1; }
            echo APIM_IN_PATH_OK

  # DO-106 (2026-11-06): CORS на ПРОД-входе — отдельный джоб, потому что этот класс дефекта
  # не виден ни одному прежнему гейту: они проверяют коды без `Origin` и не делают preflight.
  # Симптом был: `OPTIONS` → 401, в ответах нет `Access-Control-Allow-Origin`, а фронт
  # (другой origin) читал это как «Нет связи с сервером». `if: always()` — мерим даже когда
  # `deploy-prod` пропущен: прод всё равно публичный, и CORS должен быть в порядке.
  smoke-prod-cors:
    needs: [deploy-prod]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # 2026-11-11: CI запускал `tools/check_cors_entry.py` — копию на 6 314 байт, а артефакт
      # @TE (TE-090) лежит в `9-tests/scripts/` и весит 9 641 (после него добавлены офлайн-режимы).
      # То есть гейт был подключён, но проверял НЕ тот файл, который принимали — класс
      # «гейт на месте, артефакт другой». Зовём артефакт напрямую: одна правка вместо копии.
      - name: Самопроверка гейта
        run: python3 9-tests/scripts/check_cors_entry.py --selftest

      - name: CORS на прод-входе (preflight + ACAO)
        env:
          PROD_BASE: https://xdiary-vps1.taile0b6ee.ts.net
        run: |
          set -uo pipefail
          python3 9-tests/scripts/check_cors_entry.py --base "$PROD_BASE"
          rc=$?
          echo "check_cors_entry rc=$rc"
          exit $rc
