name: Docs budget (инструкции не выпадают из контекста)

# Все AGENTS.md грузятся вместе, лимит DSH — 64 КиБ. При переполнении файл МОЛЧА
# перестаёт подхватываться (так правила проекта однажды выпали из контекста ролей).
# Гейт ловит это до того, как кто-то заметит по последствиям.

on:
  push:
    branches: ["main"]
    paths:
      - '**/AGENTS.md'
      - '9-tests/**'
      - 'RULES.md'
      - 'loop.config.json'
      - 'tools/check_docs_size.py'
      - 'tools/check_adr.py'
      - '04-architecture/ADL/**'
      - '.github/workflows/docs-budget.yml'
  workflow_dispatch:

concurrency:
  group: docs-budget
  cancel-in-progress: true

jobs:
  docs-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Сумма и размер каждого AGENTS.md
        run: python tools/check_docs_size.py
      - name: Доки без личных путей и токенов
        run: python tools/check_rule_docs.py
      - name: Карта тестов актуальна (проект → сервисы)
        run: python tools/check_test_map.py
      - name: Формат PDR и индекс
        run: python tools/check_pdr.py
      # D-17/ADR-шаблон: гейт формата ADR (AGENTS.md §5.2 ссылается на этот скрипт).
      # Порядок важен: --selftest доказывает, что гейт УМЕЕТ падать — иначе это
      # «правило, которое выглядит работающим» (класс, который ловили весь день).
      - name: Самопроверка гейта ADR (негативный контроль)
        run: python tools/check_adr.py --selftest
      # Проверяем ТОЛЬКО затронутые ADR. Фолбэк на `--since` нельзя: он красит
      # исторические ADR (018–022 писались до шаблона) — проверено прогоном #49,
      # где именно этот фолбэк уронил шаг. Ошибка была моя, не гейта.
      - name: Формат новых/изменённых ADR
        run: |
          set -euo pipefail
          BASE="${{ github.event.before }}"
          RANGE=""
          if [ -n "$BASE" ] && [ "$BASE" != "0000000000000000000000000000000000000000" ] \
             && git rev-parse --verify --quiet "$BASE^{commit}" >/dev/null; then
            RANGE="$BASE..${{ github.sha }}"
          elif git rev-parse --verify --quiet "HEAD~1^{commit}" >/dev/null; then
            RANGE="HEAD~1..HEAD"
          fi
          if [ -z "$RANGE" ]; then
            echo "::warning::ADR-гейт не проверял: нет базовой ревизии (первый коммит). Самопроверка выше пройдена."
            exit 0
          fi
          echo "проверяю ADR в диапазоне $RANGE"
          python tools/check_adr.py --range "$RANGE"
