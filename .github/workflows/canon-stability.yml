name: canon-stability

# @AR 2026-11-10 12:34: «одиночный флейк и систематическая ненадёжность выглядят одинаково».
# Этот workflow измеряет именно ЧАСТОТУ: гоняет канон входа N раз подряд и печатает таблицу
# rc по попыткам. Тревога — если rc=2 случился больше одного раза из N (это уже не флейк).
#
# Ручной запуск и расписание (утро), чтобы не занимать очередь на каждый пуш.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'Сколько проходов канона'
        default: '3'
      pause:
        description: 'Пауза между проходами, секунды (5 минут = 300)'
        default: '300'
      base:
        description: 'База (прод-вход)'
        default: 'https://xdiary-vps1.taile0b6ee.ts.net'
  schedule:
    - cron: '15 6 * * *'

permissions:
  contents: read

concurrency:
  group: canon-stability
  cancel-in-progress: false

jobs:
  stability:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Канон N раз, rc по попыткам
        env:
          BASE: ${{ inputs.base || 'https://xdiary-vps1.taile0b6ee.ts.net' }}
          RUNS: ${{ inputs.runs || '3' }}
          PAUSE: ${{ inputs.pause || '300' }}
        run: |
          # Actions запускает `bash -e`: без `set +e` первый же ненулевой rc канона обрывал
          # весь цикл (ровно так упал #1 — без единой строки «попытка N»).
          set -uo pipefail
          set +e
          rc2=0
          rc1=0
          rc1_repeat=0
          rc0=0
          rows=""
          # @TE 16:12: машинный различитель «не исполнялось» vs «исполнялось и упало».
          # Баннер печатается первой строкой скрипта; без него причина не в каноне, а в запуске.
          echo "--- диагностика запуска ---"
          command -v python || echo "::error::python не найден в PATH"
          python -u -c "import sys; print('python', sys.version.split()[0], sys.executable)" || true
          ls -l 9-tests/scripts/check_apim_auth.py || echo "::error::скрипт канона отсутствует"
          echo "--- конец диагностики ---"
          for i in $(seq 1 "$RUNS"); do
            t0=$SECONDS
            python 9-tests/scripts/check_apim_auth.py --all --base "$BASE" > "/tmp/canon-$i.log" 2>&1
            rc=$?
            dur=$((SECONDS - t0))
            line="$(grep -m1 'REF=' "/tmp/canon-$i.log" || true)"
            banner="$(grep -m1 'check_apim_auth: старт' "/tmp/canon-$i.log" || true)"
            if [ -z "$banner" ]; then
              echo "  ::error::баннера старта нет — файл не исполнялся (не тот python / нет файла / отказ до кода)"
            fi
            [ "$rc" = "0" ] && rc0=$((rc0 + 1))
            where="$(printf '%s' "$line" | sed -n 's/.*where=\([^ ]*\).*/\1/p')"
            rows="${rows}| $i | rc=$rc | ${dur} с | ${where:-—} | ${line} |"$'\n'
            [ "$rc" = "2" ] && rc2=$((rc2 + 1))
            [ "$rc" = "1" ] && rc1=$((rc1 + 1))
            echo "проход $i: rc=$rc | ${dur} с"
            echo "  квитанция: $line"
            # 2026-11-10: при rc≠0 квитанции может не быть (падание ДО печати) — тогда
            # причина не видна. Печатаем хвост лога попытки, иначе снова «не измерено вслепую».
            if [ "$rc" != "0" ] && [ -z "$line" ]; then
              echo "  ── хвост лога попытки $i ──"
              tail -15 "/tmp/canon-$i.log" 2>/dev/null || echo "  (лога нет)"
              echo "  ── конец хвоста ──"
            fi
            # @TL 14:55: «нарушители» могут появляться ОТ ПОВТОРА (троттлинг/лимиты),
            # а не от канона. Различаем: rc=1 на ПЕРВОМ прогоне — канон нарушен;
            # rc=1 только на повторах — гейт измерил сам себя (warning, не error).
            if [ "$rc" = "1" ] && [ "$i" != "1" ]; then rc1_repeat=$((rc1_repeat + 1)); fi
            # 2026-11-10: прогоны подряд бьют по лимитам APIM — пауза, чтобы измерять канон,
            # а не собственную частоту запросов.
            # @TL 14:55: 20 с недостаточно — троттлинг возможен и после минутной паузы.
            # @TL 15:30: пауза 5 минут (не 20 с) — проверяем «лимит с длинным окном».
            [ "$i" -lt "$RUNS" ] && sleep "${PAUSE:-300}"
          done
          {
            echo "### canon-stability: rc=0 за $RUNS: $rc0 · rc=1 (нарушители) за $RUNS: $rc1 · rc=2 (не измерено) за $RUNS: $rc2"
            echo
            echo "| проход | rc | длительность | where | квитанция |"
            echo "|---|---|---|---|---|"
            printf '%s' "$rows"
          } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          echo "ИТОГ: rc=0 за $RUNS: $rc0 · rc=1 за $RUNS: $rc1 · rc=2 за $RUNS: $rc2"
          # @TL 16:05: дыра «зелёный на пустоте». Ветка самотроттлинга стояла ДО проверок
          # и не требовала ни одного rc=0: при RUNS=2 «rc=2, rc=1» давало exit 0 с warning,
          # хотя канон НИ РАЗУ не измерился. Поэтому: сначала «есть ли хоть одно измерение».
          if [ "$rc0" = "0" ]; then
            echo "::error::канон не измерен ни разу за $RUNS проходов (нет ни одного rc=0) — это не «канон нарушен» и не «зелено»"
            exit 1
          fi
          # 2026-11-10 (@DO): в #2 все пять попыток дали rc=1, а workflow сказал success —
          # потому что считал только rc=2. Теперь rc=1 (нарушитель) валит прогон, как и должен.
          if [ "$rc1" -gt 0 ] && [ "$rc1_repeat" = "$rc1" ] && [ "$rc2" = "0" ]; then
            echo "::warning::rc=1 во всех $rc1 прогонах, но НИ РАЗУ на первом — похоже на самотроттлинг"
            echo "::warning::гейт измерил сам себя: канон не подтверждён, но и не опровергнут — нужен повтор с холодного старта"
            exit 0
          fi
          if [ "$rc1" -gt 0 ]; then
            echo "::error::канон нарушен: rc=1 на первом прогоне (всего rc=1: $rc1 из $RUNS, из них на повторах: $rc1_repeat)"
            exit 1
          fi
          if [ "$rc2" -gt 1 ]; then
            echo "::error::канон нестабилен: rc=2 в $rc2 из $RUNS прогонов — это не одиночный флейк"
            exit 1
          fi
          if [ "$rc2" = "1" ]; then
            echo "::warning::канон дал rc=2 один раз из $RUNS — похоже на флейк пробы, но зафиксировано"
          fi
          exit 0
