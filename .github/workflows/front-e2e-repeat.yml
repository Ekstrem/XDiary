name: front-e2e-repeat

# TE-036: измерение флейкости отдельных спеков, НЕ гейт.
# Запускается только вручную (workflow_dispatch), чтобы не занимать очередь на каждый пуш.
# --workers=1 обязателен: иначе воркеры делят один dev-стенд и создают ту самую гонку,
# которую мы измеряем.
on:
  workflow_dispatch:
    inputs:
      specs:
        description: 'Спеки через пробел'
        required: false
        default: 'tests/partner-edit.spec.js tests/add-partner.spec.js tests/settings.spec.js tests/csv.spec.js'
      repeat:
        description: '--repeat-each'
        required: false
        default: '5'
      cleanup:
        description: 'Чистить стенд перед прогоном (yes/no). no = проверка на ГРЯЗНОМ стенде'
        required: false
        default: 'yes'
      workers:
        description: '--workers'
        required: false
        default: '1'

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # DO-079/@AR 09:20: группа была общей с `ci-front.yml` (`front-e2e`), и ручной
    # прогон ВЫТЕСНЯЛСЯ пушем: GitHub держит в группе один pending-прогон, поэтому
    # dispatch получал `cancelled` с нулём шагов (#15/#16). Теперь группы разные по
    # триггеру: manual не конкурирует с push.
    # Остаточный риск (два прогона на одном стенде) снят шагом «ждать ci-front» ниже.
    concurrency:
      group: front-e2e-${{ github.event_name == 'workflow_dispatch' && 'manual' || 'push' }}
      cancel-in-progress: false
    env:
      XDIARY_E2E_BASE_URL: http://127.0.0.1:8080
      XDIARY_E2E_PIN: "1234"
      # DO-079 / TE-054: read-path без сети (read-paths.md §3 п.1) — спеки не должны
      # зависеть от живого канала чтения, иначе «зелено» означает «удалось достучаться».
      XDIARY_READPATH_OFFLINE: "1"
      SPECS: ${{ inputs.specs }}
      REPEAT: ${{ inputs.repeat }}
      WORKERS: ${{ inputs.workers }}
    steps:
      # Стенд один на всех: перед стартом ждём, пока не идёт E2E из `ci-front.yml`
      # (другая группа concurrency его не останавливает, а чистящие шаги обоих
      # прогонов удаляют данные друг друга → флейк «список пуст»).
      - name: Ждать, пока не идёт E2E из ci-front (максимум 10 мин)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for i in $(seq 1 20); do
            busy=$(gh api "repos/${{ github.repository }}/actions/workflows/ci-front.yml/runs?status=in_progress" \
                     --jq '.workflow_runs | length' 2>/dev/null || echo 0)
            [ "$busy" = "0" ] && { echo "ci-front не идёт — стартуем"; exit 0; }
            echo "ci-front в процессе ($busy), ждём 30 с…"; sleep 30
          done
          echo "::warning::ci-front так и не освободил стенд за 10 мин — стартуем, но прогон может быть шумным"
      # `Reset dev PIN to 1234` убран (DO/@TL 17:11): он дёргал legacy-контур `/privacy/pin/set`,
      # хотя спеки используют ЛОКАЛЬНЫЙ PIN (`setPin` в localStorage, api.js) — серверный PIN
      # им не нужен. Гейт больше не зависит от `/privacy/*`.
      - name: Очистить накопленные E2E-данные на dev (DO-044)
        # `cleanup=no` нужен для честного замера на ГРЯЗНОМ стенде: иначе этот шаг
        # сам убирает чужие карточки, и «проверка на грязном» превращается в проверку на чистом.
        if: ${{ inputs.cleanup != 'no' }}
        # Каждый прогон создаёт клиента и партнёра и не удаляет их: к 02.11 накопилось
        # 2639 partners / 1751 clients, `#onboarding-list` доходил до 2607 узлов (588 КБ),
        # `.first()` выбирал произвольную старую карточку → флейк «Список партнёров пуст».
        # Чистка перед прогоном возвращает список к 0 и снимает этот класс падений.
        # Клиенты тоже чистим: телефон в спеке = +7999777 + 4 цифры Date.now() → всего 10 000
        # вариантов, и при 1751 существующих клиентах коллизия ~16% за прогон. Дубликат телефона
        # на POST /clients сейчас отдаёт 500 (duplicate key 23505) — это отдельный дефект @BE.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: |
            SCRIPT=/opt/xdiary/7-deploy/cleanup-e2e-dev.sh
            if [ ! -f "$SCRIPT" ]; then
              echo "::warning::скрипт очистки не найден на стенде — прогон без очистки"
              exit 0
            fi
            # @TL 17:57: удаляем ТОЛЬКО тестовые телефоны (+7999…) и печатаем отчёт
            # «до/после», чтобы было видно, что и сколько удалено (журнал/аналитика не задеты).
            echo "=== DRY-RUN (что будет удалено) ==="
            bash "$SCRIPT" | tee /tmp/cleanup-dry.txt
            echo "=== APPLY (--clients: только +7999…) ==="
            bash "$SCRIPT" --apply --clients | tee /tmp/cleanup-apply.txt
            {
              echo "### Очистка dev перед прогоном (DO-044)"
              echo
              echo '```'
              echo "--- dry-run ---"
              cat /tmp/cleanup-dry.txt
              echo "--- apply ---"
              cat /tmp/cleanup-apply.txt
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"

      - uses: actions/checkout@v4

      # 2026-11-07: раннер не в tailnet — без туннеля браузер получал `Failed to fetch`
      # на `/clients/me` и спеки падали на входе (csv 5/5, partner-edit 5/5, прогон #17).
      - name: Туннель к dev (127.0.0.1:8080)
        env:
          DEV_KEY: ${{ secrets.DEV_SSH_KEY }}
          DEV_HOST: ${{ secrets.DEV_SSH_HOST }}
          DEV_USER: ${{ secrets.DEV_SSH_USER }}
        run: |
          set -euo pipefail
          install -m 600 /dev/null /tmp/dev_key
          printf '%s\n' "$DEV_KEY" > /tmp/dev_key
          ssh -i /tmp/dev_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ExitOnForwardFailure=yes -f -N -L 8080:127.0.0.1:8080 "$DEV_USER@$DEV_HOST"
          for i in $(seq 1 30); do
            if curl -fsS -m 3 http://127.0.0.1:8080/health >/dev/null; then
              echo "туннель поднят, /health отвечает (попытка $i)"; exit 0
            fi
            sleep 2
          done
          echo "::error::туннель не отвечает"; exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        working-directory: 9-tests/RnD/front-e2e
        run: npm ci || npm install

      - name: Install Playwright browsers
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright install --with-deps chromium

      - name: Repeat run (list)
        working-directory: 9-tests/RnD/front-e2e
        continue-on-error: true
        run: |
          echo "спеки: $SPECS | repeat-each=$REPEAT | workers=$WORKERS"
          # Пишем list-вывод в файл: json-репортёр в этой связке файла не создавал,
          # и итоговый шаг молча выходил с кодом 0 без таблицы (02.11, #5).
          set -o pipefail
          npx playwright test $SPECS --repeat-each="$REPEAT" --workers="$WORKERS" --trace on 2>&1 | tee test-results/pw.log \

      # 2026-11-07: у падений E2E не было артефактов (`artifacts: 0` в #1785), поэтому
      # разбор шёл по строкам лога, а не по DOM/сети. Теперь трассы поднимаются всегда.
      - name: Артефакты падения (trace, скриншоты, error-context)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.workflow }}-failure-${{ github.run_id }}
          path: |
            9-tests/RnD/front-e2e/test-results
            9-tests/RnD/front-e2e/playwright-report
          retention-days: 7

      # 2026-11-10 (@TE 11:45): классы падений — в лог, а не только в артефакт.
      - name: Классы падений (e2e_triage)
        if: always()
        run: |
          f=9-tests/RnD/front-e2e/test-results/pw.log
          if [ -f "$f" ]; then python 9-tests/scripts/e2e_triage.py --input "$f" || true; else echo "нет $f — триаж не нужен"; fi
          if-no-files-found: ignore
            --reporter=list 2>&1 | tee /tmp/repeat-list.txt || true

      - name: Итог по спекам
        if: always()
        run: |
          python3 - <<'PY'
          import collections, os, re, sys
          path = '/tmp/repeat-list.txt'
          if not os.path.exists(path):
              print('::error title=[flaky] нет вывода list-репортёра::измерение не состоялось, это НЕ зелёный прогон')
              sys.exit(1)
          lines = open(path, encoding='utf-8', errors='replace').read().splitlines()
          # маркеры playwright: ✓ passed, ✘ failed, - skipped; имя спека — в строке
          agg = collections.OrderedDict()
          pat = re.compile(r'^\s*([\u2713\u2717\u2718\u00d7\-\u00bb\u203a])\s+\d+\s+(tests/[\w./-]+\.spec\.js)')
          for line in lines:
              m = pat.search(line)
              if not m:
                  continue
              mark, spec = m.group(1), m.group(2)
              a = agg.setdefault(spec, collections.Counter())
              if mark == '\u2713': a['passed'] += 1
              elif mark in ('\u2717', '\u2718', '\u00d7'): a['failed'] += 1
              else: a['skipped'] += 1
          out = []
          out.append('| спек | passed | failed | skipped | итого |')
          out.append('|---|---|---|---|---|')
          total = collections.Counter()
          for spec, a in agg.items():
              n = a['passed'] + a['failed'] + a['skipped']
              out.append('| `%s` | %d | %d | %d | %d |' % (spec, a['passed'], a['failed'], a['skipped'], n))
              for k in ('passed', 'failed', 'skipped'): total[k] += a[k]
          out.append('| **итого** | **%d** | **%d** | **%d** | **%d** |' % (total['passed'], total['failed'], total['skipped'], total['passed'] + total['failed'] + total['skipped']))
          out.append('')
          out.append('repeat-each=%s workers=%s' % (os.environ.get('REPEAT'), os.environ.get('WORKERS')))
          table = chr(10).join(out)
          print(table)
          summary = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary:
              with open(summary, 'a', encoding='utf-8') as fh:
                  fh.write('### front-e2e-repeat: ' + 'частоты падений' + chr(10) + chr(10) + table + chr(10))
          if not agg:
              print('::error title=[flaky] не разобрал ни одного результата::смотри шаг выше')
              sys.exit(1)
          if total['failed']:
              print('::error title=[flaky] падения::%d failed из %d' % (total['failed'], total['passed'] + total['failed'] + total['skipped']))
              sys.exit(1)
          print('::notice::падений нет: %d passed из %d' % (total['passed'], total['passed'] + total['skipped']))
          PY

