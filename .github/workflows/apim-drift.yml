name: APIM drift with token (@AR 2026-11-05 18:50)

# Зачем: сверка «реестр ↔ APIM» возможна ТОЛЬКО с `GRAVITEE_TOKEN` (Management API требует Bearer).
# До этого workflow секрет не был подключён НИГДЕ: `git grep GRAVITEE_TOKEN -- .github tools`
# → совпадений нет, то есть ветка сравнения с APIM никогда не исполнялась в CI.
# Следствие: «серая зона» была вечной не из-за отсутствия инструмента, а из-за отсутствия секрета.
#
# Квитанция (условие @AR 18:50): REF / образ / время + расхождения списком
# «что в реестре, что в APIM» — печатает сам инструмент (`receipt_header`).
#
# Требуется один секрет репозитория: GRAVITEE_TOKEN (Management API, Bearer).
# Без него шаг честно даёт rc=2 (НЕ ИЗМЕРЕНО), а не зелёное.

on:
  workflow_dispatch:

concurrency:
  group: apim-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Самопроверка гейта
        run: python3 tools/check_apim_drift.py --selftest

      - name: Режим без токена (спеки против индекса)
        run: python3 tools/check_apim_drift.py --specs-only

      # 2026-11-06 (@DO): рабочий способ — Basic на v2 (v3 token даёт 500, json-логин 401).
      # Поэтому основной секрет — GRAVITEE_BASIC (формат user:password); GRAVITEE_TOKEN
      # остаётся как резерв на случай смены схемы APIM.
      - name: Есть ли секрет GRAVITEE_BASIC или GRAVITEE_TOKEN
        id: basic
        env:
          B: ${{ secrets.GRAVITEE_BASIC }}
        run: |
          if [ -n "${B}" ]; then echo "have=yes" >> "$GITHUB_OUTPUT"; else echo "have=no" >> "$GITHUB_OUTPUT"; fi

      - name: Есть ли секрет GRAVITEE_TOKEN
        id: token
        env:
          T: ${{ secrets.GRAVITEE_TOKEN }}
        run: |
          if [ -z "${T}" ]; then
            echo "have=no" >> "$GITHUB_OUTPUT"
            echo "::warning::GRAVITEE_TOKEN не задан в секретах репозитория — сверка с APIM НЕ будет выполнена (rc=2), это не «совпадает»"
          else
            echo "have=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Копировать инструмент и реестр на прод
        if: steps.basic.outputs.have == 'yes' || steps.token.outputs.have == 'yes'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "tools/check_apim_drift.py,04-architecture/api-index.yaml,openapi"
          target: "/home/deploy/apim-drift"

      - name: Сверка с APIM (токен не печатается)
        if: steps.basic.outputs.have == 'yes' || steps.token.outputs.have == 'yes'
        uses: appleboy/ssh-action@v1.2.0
        env:
          GRAVITEE_TOKEN: ${{ secrets.GRAVITEE_TOKEN }}
          GRAVITEE_BASIC: ${{ secrets.GRAVITEE_BASIC }}
        with:
          port: 8237
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: GRAVITEE_TOKEN,GRAVITEE_BASIC
          script_stop: true
          script: |
            set -u
            cd /home/deploy/apim-drift
            python3 tools/check_apim_drift.py \
              --root . \
              --api http://127.0.0.1:18083 \
              --container xdiary-apim-management
