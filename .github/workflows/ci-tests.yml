name: Test (9-tests)

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

env:
  # Р”РІРёР¶РєРё РїСЂРѕРІРµСЂРѕРє Р¶РёРІСѓС‚ РІ LoopMaker (РѕРґРёРЅ РёСЃС‚РѕС‡РЅРёРє РїСЂР°РІРґС‹), РїСЂРѕРµРєС‚ РґРµСЂР¶РёС‚ С‚РѕР»СЊРєРѕ
  # loop.config.json. РџРёРЅ РЅР° С‚РµРі, РєРѕРіРґР° LoopMaker СЃС‚Р°Р±РёР»РёР·РёСЂСѓРµС‚СЃСЏ: ref: v0.2.0
  LOOPMAKER_REF: main
  LOOPMAKER_REPO: Ekstrem/LoopMaker

jobs:
  check-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Checkout LoopMaker (Р»РёРЅС‚РµСЂ С„РѕСЂРјР°С‚Р° С‡Р°С‚Р°)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LOOPMAKER_REPO }}
          ref: ${{ env.LOOPMAKER_REF }}
          token: ${{ secrets.PROJECT_PAT }}
          path: .loopmaker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check chat format (РЅРµС‚ РјРѕР»С‡Р° РїРѕС‚РµСЂСЏРЅРЅС‹С… СЃРѕРѕР±С‰РµРЅРёР№)
        run: python .loopmaker/tools/chat_lint.py --config loop.config.json --check

  guard-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout РїСЂРѕРµРєС‚Р° (РЅСѓР¶РЅР° РёСЃС‚РѕСЂРёСЏ РґР»СЏ --range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout LoopMaker (РґРІРёР¶РѕРє РїСЂРѕРІРµСЂРєРё СЃРµРєСЂРµС‚РѕРІ)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.LOOPMAKER_REPO }}
          ref: ${{ env.LOOPMAKER_REF }}
          token: ${{ secrets.PROJECT_PAT }}
          path: .loopmaker
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: РџСЂРѕРІРµСЂРёС‚СЊ СЃРµРєСЂРµС‚С‹ Рё РёС… С„СЂР°РіРјРµРЅС‚С‹ РІ РїСѓС€РёРјРѕРј РґРёР°РїР°Р·РѕРЅРµ
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          head="${AFTER:-HEAD}"
          git cat-file -e "${head}^{commit}" 2>/dev/null || head=HEAD
          if [ -n "${PR_BASE:-}" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            range="${PR_BASE}..${head}"          # pull_request: Р±Р°Р·Р° PR -> РіРѕР»РѕРІР°
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${head}"           # push: С‡С‚Рѕ РёРјРµРЅРЅРѕ РїСЂРёР»РµС‚РµР»Рѕ
          else
            range="${head}~1..${head}"           # СЂСѓС‡РЅРѕР№ Р·Р°РїСѓСЃРє
          fi
          echo "range: ${range}"
          python .loopmaker/tools/check_secrets.py --config loop.config.json --range "$range"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run integration tests (9-tests)
        shell: bash
        run: |
          set -euo pipefail
          for proj in $(find 9-tests -name '*.IntegrationTests.csproj' | sort); do
            echo "=== $proj ==="
            dotnet test "$proj" --verbosity minimal
          done

  front-e2e:
    runs-on: ubuntu-latest
    env:
      # Р–РёРІС‹Рµ E2E (change-pin Рё С‚.Рї.) РіРѕРЅСЏРµРј РїСЂРѕС‚РёРІ С‚РµСЃС‚РѕРІРѕРіРѕ СЃС‚РµРЅРґР° VPS-2 (ADR-019),
      # С‡С‚РѕР±С‹ РґРµСЃС‚СЂСѓРєС‚РёРІРЅС‹Рµ PIN-СЃС†РµРЅР°СЂРёРё РЅРµ С‚СЂРѕРіР°Р»Рё РїСЂРѕРґ VPS-1.
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
      XDIARY_E2E_PIN: "1234"
    steps:
      - name: Reset dev PIN to 1234
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: bash /opt/xdiary/7-deploy/reset-dev-pin.sh
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: 9-tests/RnD/front-e2e
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright install --with-deps chromium
      - name: Front E2E
        working-directory: 9-tests/RnD/front-e2e
        run: npm test
