name: Test (9-tests)

on:
  push:
    branches: ["main"]
    # DO-031: правки задач и чата ролей не триггерят тяжёлые test/front-e2e (иначе
    # каждый пуш в переписку отменяет идущий E2E). Guard'ы — в chat-guards.yml,
    # который теперь слушает и `5-tech-backlog/**` (DO-032: секреты в задачах).
    paths-ignore:
      - '5-tech-backlog/**'
      - '0*/**'
      - '01-user-stories/**'
      - '02-cjm/**'
      - '03-ddd/**'
      - '04-architecture/**'
      - '*.md'
  pull_request:
  workflow_dispatch:

# Политика отмены (DO-023, решение владельца 2026-11-05): прогоны НЕ отменяются новым
# пушем — оба джоба идут в очередь. «test не трогать первые 5 минут» GitHub не умеет,
# поэтому эквивалент — не отменять вовсе. Очередь не раздувается: чат-пуши отфильтрованы
# paths-ignore, code-пуши редкие. Отменённый прогон не считается доказательством (TL).

jobs:
  check-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check chat format (нет молча потерянных сообщений)
        run: python tools/chat_lint.py --config loop.config.json --check

  guard-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (нужна история для --range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить секреты и их фрагменты в пушимом диапазоне
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          head="${AFTER:-HEAD}"
          git cat-file -e "${head}^{commit}" 2>/dev/null || head=HEAD
          if [ -n "${PR_BASE:-}" ] && git cat-file -e "${PR_BASE}^{commit}" 2>/dev/null; then
            range="${PR_BASE}..${head}"            # pull_request: база PR -> голова
          elif [ -n "${BEFORE:-}" ] \
               && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${head}"             # push: что именно прилетело
          else
            range="${head}~1..${head}"             # ручной запуск
          fi
          echo "range: ${range}"
          python tools/check_secrets.py --config loop.config.json --range "$range"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ci-tests-test
      # Решение владельца (2026-11-05): не отменять прогон новым пушем (== «не трогать
      # первые 5 минут», который GitHub нативно не умеет). Идём в очередь.
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run integration tests (9-tests)
        shell: bash
        run: |
          set -euo pipefail
          for proj in $(find 9-tests -name '*.IntegrationTests.csproj' | sort); do
            echo "=== $proj ==="
            dotnet test "$proj" --verbosity minimal
          done

  front-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: front-e2e
      cancel-in-progress: false
    env:
      # Живые E2E (change-pin и т.п.) гоняем против тестового стенда VPS-2 (ADR-019),
      # чтобы деструктивные PIN-сценарии не трогали прод VPS-1.
      XDIARY_E2E_BASE_URL: https://xdiary-vps2.taile0b6ee.ts.net
      XDIARY_E2E_PIN: "1234"
    steps:
      - name: Reset dev PIN to 1234
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_KEY }}
          script: bash /opt/xdiary/7-deploy/reset-dev-pin.sh
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: 9-tests/RnD/front-e2e
        run: npm ci || npm install
      - name: Install Playwright browsers
        working-directory: 9-tests/RnD/front-e2e
        run: npx playwright install --with-deps chromium
      - name: Front E2E
        working-directory: 9-tests/RnD/front-e2e
        run: npm test
