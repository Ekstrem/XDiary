name: Build and publish Journal microservice

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/Shared/**'
      - '6-msa/BC-Journal/**'
      - '6-msa/BC-Client/src/Client.ApiTests/**'
      - '.github/workflows/ci-journal.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/Shared/**'
      - '6-msa/BC-Journal/**'
      - '6-msa/BC-Client/src/Client.ApiTests/**'
      - '.github/workflows/ci-journal.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-journal

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/BC-Journal

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/Journal.sln

    - name: Build
      run: dotnet build src/Journal.sln --no-restore --configuration Release
    # ADR-028 + @TL 2026-11-14 19:11: прогон ВСЕХ тестовых проектов сервиса
    # (`*.Domain.Tests`, `*.IntegrationTests`, `*.ApiTests`), а не списка из двух имён:
    # новый тест иначе не запускается. Пустой список = `::error::` («нет тестов» ≠ зелёный).
    - name: Тесты Journal (в папке сервиса)
      shell: bash
      run: |
        set -uo pipefail
        fail=0
        found=0
        for p in src/*Tests*/*.csproj; do
          [ -e "$p" ] || continue
          found=1
          echo "=== $p ==="
          log="/tmp/test-$(basename "$p" .csproj).log"
          dotnet test "$p" --configuration Release --verbosity normal > "$log" 2>&1 || fail=1
          # Имена упавших тестов — в аннотацию: логи джоб по API недоступны (403), а аннотации
          # читаются. Без этого красный шаг говорит «см. вывод dotnet test выше» — и никто,
          # включая @BE и @TL, не знает, что именно чинить (2026-11-05 00:02).
          # Формат xunit в CI отличается от локального: строка может быть с любым отступом
          # («Failed X [1 ms]») или это MSBuild-ошибка сборки. Поэтому ловим оба и печатаем
          # ОТДЕЛЬНУЮ аннотацию на каждую строку — @TL читает аннотации без токена.
          # ВАЖНО: шаг исполняется `bash -e` (см. `shell: bash`), поэтому ЛЮБАЯ команда
          # с ненулевым кодом убивает шаг до печати аннотации. Именно на этом падало:
          # `grep` без совпадений возвращал 1 → шаг умирал сразу после `=== ...csproj ===`,
          # и ни имён тестов, ни причины не было (run 41924631415).
          fails=$(grep -E '^[[:space:]]*Failed ' "$log" || true)
          if [ -n "${fails:-}" ]; then
            printf '%s\n' "$fails" | sed -E 's/^[[:space:]]*Failed //; s/ \[[0-9].*$//' | head -20 > /tmp/names.txt || true
            while IFS= read -r name; do
              [ -n "$name" ] && echo "::error title=[tests] Journal $(basename "$p")::Failed ${name}"
            done < /tmp/names.txt
          elif [ "$fail" -ne 0 ]; then
            reason=$(grep -E 'error [A-Z]+[0-9]+|Exception|MSB[0-9]+' "$log" | head -3 || true)
            echo "::error title=[tests] Journal $(basename "$p") (без Failed)::${reason:-нет строк ошибок в логе}"
          fi
          tail -30 "$log"
        done
        if [ "$found" -eq 0 ]; then
          echo "::error title=[tests] в BC-Journal нет тестовых проектов::ждали src/*Tests*/*.csproj"
          exit 1
        fi
        if [ "$fail" -ne 0 ]; then
          echo "::error title=[tests] есть падения::см. вывод dotnet test выше"
          exit 1
        fi
        echo "тесты BC-Journal зелёные"


    - name: Unit Tests
      run: dotnet test src/Journal.Domain.Tests/Journal.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Integration Tests
      run: dotnet test src/Journal.IntegrationTests/Journal.IntegrationTests.csproj --configuration Release --verbosity normal

    # ADR-028 этап 1 (@AR 2026-11-13 19:25): пара Client↔Journal должна бежать при
    # изменении ЛЮБОЙ из сторон. После ADR-028 пара живёт у потребителя:
    # `6-msa/BC-Client/src/Client.ApiTests/**` — общего набора `6-msa/E2E` больше нет.
    # запускаем её отсюда; после переноса к потребителю (`BC-Client/src/Client.ApiTests`)
    # шаг станет no-op (hashFiles = '') и его удалит следующая правка.
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa
        file: 6-msa/BC-Journal/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single
