name: Build and publish Journal microservice

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/BC-Journal/**'
      - '6-msa/E2E/**'
      - '.github/workflows/ci-journal.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '6-msa/BC-Journal/**'
      - '6-msa/E2E/**'
      - '.github/workflows/ci-journal.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ekstrem/xdiary-journal

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 6-msa/BC-Journal

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Restore dependencies
      run: dotnet restore src/Journal.sln

    - name: Build
      run: dotnet build src/Journal.sln --no-restore --configuration Release

    - name: Unit Tests
      run: dotnet test src/Journal.Domain.Tests/Journal.Domain.Tests.csproj --no-build --configuration Release --verbosity normal

    - name: Integration Tests
      run: dotnet test src/Journal.IntegrationTests/Journal.IntegrationTests.csproj --configuration Release --verbosity normal

    # ADR-028 этап 1 (@AR 2026-11-13 19:25): пара Client↔Journal должна бежать при
    # изменении ЛЮБОЙ из сторон. Пока она лежит в общем наборе (`6-msa/E2E/...`),
    # запускаем её отсюда; после переноса к потребителю (`BC-Client/src/Client.ApiTests`)
    # шаг станет no-op (hashFiles = '') и его удалит следующая правка.
    - name: Пара Client↔Journal (переходно, до переноса к потребителю)
      if: hashFiles('6-msa/E2E/Contract.Client_Journal/**/*.csproj') != ''
      run: |
        set -e
        for p in 6-msa/E2E/Contract.Client_Journal/**/*.csproj; do
          [ -e "$p" ] || continue
          echo "== $p"
          dotnet test "$p" --configuration Release --verbosity normal
        done

  docker:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - uses: actions/checkout@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=raw,value=single
          type=raw,value=latest
          type=sha,prefix=single-

    - name: Build and push Docker image (Single profile)
      uses: docker/build-push-action@v6
      with:
        context: 6-msa
        file: 6-msa/BC-Journal/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          DEPLOYMENT_PROFILE=Single
