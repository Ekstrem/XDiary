name: Chat guards

on:
  push:
    branches: ["main"]
    paths:
      - '5-tech-backlog/chat/**'

# Chat-коммиты проверяем лёгкими guard'ами (без test/front-e2e).
concurrency:
  group: chat-guards
  cancel-in-progress: true

jobs:
  check-chat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check chat format (нет молча потерянных сообщений)
        run: python tools/chat_lint.py --config loop.config.json --check

  guard-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (нужна история для --range)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить секреты и их фрагменты в пушимом диапазоне
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          set -uo pipefail
          head="${AFTER:-HEAD}"
          git cat-file -e "${head}^{commit}" 2>/dev/null || head=HEAD
          if [ -n "${BEFORE:-}" ] \
             && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            range="${BEFORE}..${head}"
          else
            range="${head}~1..${head}"
          fi
          echo "range: ${range}"
          python tools/check_secrets.py --config loop.config.json --range "$range"
