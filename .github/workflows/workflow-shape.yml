name: Workflow shape

# Гейт формы workflow (находка @DO 2026-11-04). Реальный случай: после удаления
# `inputs.tag` (DO-066) в `deploy.yml` остались пустые блоки `inputs:` и `env:` —
# GitHub такой файл не принимает, и это видно как прогон **без джобов**
# (`jobs: 0`, conclusion=failure, created == updated), то есть сообщение не указывает
# на файл, а прод-деплой при этом мёртв. Отдельный workflow, чтобы правка гейтов
# не зависела от формы `ci-guards`.

on:
  push:
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  shape:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyYAML
        run: python -m pip install --quiet pyyaml
      - name: Selftest гейта
        run: python tools/check_workflow_shape.py --selftest
      - name: Проверить форму всех workflow
        run: python tools/check_workflow_shape.py
