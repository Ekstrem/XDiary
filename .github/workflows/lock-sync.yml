name: lock-sync

# Причина (@TL 09:32, повторено 18:0x): `images.lock` выводится ИЗ GIT, поэтому любой
# коммит в `6-msa/BC-*` или `8-front` его обесценивает — и следующий пуш получает
# красный CI, к его задаче не относящийся. За сутки это случилось трижды
# (`journal`/`partners`/`front`), и каждый раз лечилось командой `--write`.
#
# Здесь та же команда выполняется автоматически на пуш, который меняет эти папки:
# гейт перестаёт зависеть от памяти ролей. Ручной `--write` остаётся допустимым.

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/**'
      - '8-front/**'
      - 'tools/gen_images_lock.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write   # PR для lock (main защищён — GH006)

# DO-145 (@TL 2026-11-19 22:55): РАЗРЫВ ЦЕПОЧКИ, найденный по факту.
# `lock-sync 44599504507` стартовал по push в 19:33:13 — ДО конца `Release 44599504757`,
# увидел СТАРЫЕ digest, честно сказал «lock уже актуален — коммит не нужен» и завершился success.
# После завершения Release его НИЧТО не перезапускает ⇒ lock остался `single-6d243df`, и `deploy-prod`
# упал на страже свежести («образы старше кода»). Лечилось ручным `gh run rerun`.
# Теперь lock-sync запускается и по завершении Release — источник правды «образы собраны».
  workflow_run:
    workflows: ["Release (все сервисы с одного коммита)"]
    types: [completed]

concurrency:
  group: lock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # @TL 18:35 (принято @DO): lock пишется ТОЛЬКО если теги этого релизного коммита
      # реально опубликованы. Иначе бот снова поставит тег, которого нет в GHCR, и
      # `deploy-dev` упадёт на `lock-published` — зелёный CI при невыкатываемом lock
      # хуже красного. Проверка идёт ДО записи, а не после.
      # @TL 21:19 + @AR 21:17 + факт из ci-guards #3171 (2026-11-06 21:35):
      # здесь была развилка «не писать lock, если теги не опубликованы» — и она дала КЛИНЧ:
      # `check_lock` (гейт в `ci-guards`) требует, чтобы lock совпадал с git, а политика запрещала
      # его писать, пока теги не в GHCR. Итог: каждый коммит @BE в `6-msa` краснил `ci-guards`
      # навсегда, до зелёных сборок — то есть красный CI «как фон», ровно то, от чего уходили.
      #
      # Разделили ответственности: lock — производная от git (детерминированная), поэтому его
      # пишем всегда; а «можно ли катить» решает `lock-published` в `deploy.yml`, который падает
      # ДО `podman pull` с готовым списком отсутствующих тегов. Проверка registry здесь остаётся
      # информационным шагом (notice), чтобы было видно состояние, но не блокировала запись.
      - name: Состояние registry (информационно)
        run: |
          set -uo pipefail
          python tools/gen_images_lock.py --selftest
          # NB: shell у GitHub — `bash -e`, поэтому `rc=1` от проверки обрывал шаг
          # («информационный» шаг падал — так и было в #83/#84). Берём код явно и НЕ падаем.
          rc=0
          python tools/gen_images_lock.py --verify-registry || rc=$?
          echo "verify-registry rc=$rc"
          if [ "$rc" = "2" ]; then
            echo "::warning::registry недоступен — НЕ ИЗМЕРЕНО (lock всё равно перезапишется из git)"
          elif [ "$rc" != "0" ]; then
            echo "::notice::часть тегов этого коммита ещё не в GHCR — lock запишется, деплой заблокирует lock-published"
          fi
          exit 0

      # @TL 22:37: mixed-lock (собранный из реестра) нельзя затирать генерацией из git —
      # иначе следующая правка кода снова сделает lock невыкатываемым (у journal/partners
      # тег «последнего коммита» может быть не опубликован).
      # DO-145 (@TL 2026-11-19 21:11): ГОНКА lock-sync × Release. Факт: `#3069` влился ровно когда
      # `Release 44574918497` пересобирал `journal/partners:single-6d243df`; lock записал СТАРЫЙ digest,
      # реестр получил новый ⇒ тег перезаписан, и два deploy-прогона (44579896057, 44582458437) ушли
      # в cancel по `lock-published`. `concurrency` у release и lock-sync — РАЗНЫЕ группы (`release` /
      # `lock-sync`), поэтому они не сериализованы. Ждём, пока Release не завершится: иначе lock
      # соберётся «между» сборкой образов и пушем тегов.
      - name: Дождаться завершения Release (гонка lock × Release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            act=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=in_progress&per_page=10" --jq '.workflow_runs | length' 2>/dev/null || echo 0)
            que=$(gh api "repos/${{ github.repository }}/actions/workflows/release.yml/runs?status=queued&per_page=10" --jq '.workflow_runs | length' 2>/dev/null || echo 0)
            if [ "${act:-0}" = "0" ] && [ "${que:-0}" = "0" ]; then
              echo "::notice::Release не активен (in_progress=0, queued=0) — генерирую lock"
              exit 0
            fi
            echo "ждём Release: in_progress=$act queued=$que (попытка $i/60)"; sleep 20
          done
          echo "::error::Release не завершился за 20 мин — lock НЕ генерирую (иначе тег перезапишется)"
          exit 1

      - name: Перегенерировать lock
        run: |
          set -uo pipefail
          # @TL 12:00/12:30: lock из git-SHA ссылается на теги, которых нет в реестре
          # (`single-ae29f58` — ни у одного сервиса), и деплой стоит на первом гейте
          # `lock-published`. Поэтому источник lock — ОПУБЛИКОВАННЫЕ образы, а не git.
          # Если реестр не отдал часть сервисов — lock не трогаем (иначе снова невыкатываемый).
          set +e
          python tools/gen_images_lock.py --from-registry --write
          rc=$?
          set -e
          if [ "$rc" != "0" ]; then
            echo "::warning::lock-sync: реестр отдал не все образы (rc=$rc) — lock оставляю как был"
            git checkout -- 7-deploy/images.lock
          fi

      # DO-113: lock не должен ТЕРЯТЬ digest при перегенерации. Это блокирующая проверка:
      # если digest-строк стало меньше, чем в HEAD, файл возвращается как был и коммита нет.
      # Состояние «теги этого коммита ещё не в GHCR» остаётся ИНФОРМАЦИОННЫМ: по решению
      # (см. комментарий выше, строки 45-54) lock — производная от git, а «можно ли катить»
      # решает `lock-published` в `deploy.yml`. Смешивать эти две ответственности нельзя.
      - name: Заполнить digest из реестра (DO-113)
        # @TL 2026-11-18 13:05: при смене релизного тега merge_digests не переносит
        # digest (другой тег) — без этого шага 12 digest-строк становятся 0 и Guard откатывает lock.
        # front не публикуется (NO_REGISTRY_SERVICES) — потому `|| true`.
        run: python tools/gen_images_lock.py --fill-digests || true

      - name: Guard — digest не уменьшился (DO-113)
        run: |
          set -uo pipefail
          rc=0
          python tools/gen_images_lock.py --check-digests || rc=$?
          if [ "$rc" = "1" ]; then
            echo "::error::lock-sync: digest-строк стало МЕНЬШЕ — откатываю lock, коммита не будет (DO-113)"
            git checkout -- 7-deploy/images.lock
            exit 1
          fi
          if [ "$rc" = "2" ]; then
            echo "::warning::lock-sync: сравнить digest не с чем (rc=2) — проверить не удалось"
          else
            echo "::notice::lock-sync: digest не уменьшился"
          fi
          vrc=0
          python tools/gen_images_lock.py --verify-registry || vrc=$?
          echo "verify-registry rc=$vrc (информационно; выкатку блокирует lock-published)"

      - name: Проверить, что после записи гейт зелёный
        run: python tools/gen_images_lock.py --check

      - name: Закоммитить, если изменилось
        env:
          GH_TOKEN: ${{ github.token }}   # gh pr list/create без него падает
        run: |
          set -euo pipefail
          if git diff --quiet -- 7-deploy/images.lock; then
            echo "lock уже актуален — коммит не нужен"
            exit 0
          fi
          git config user.name "loopmaker-bot"
          git config user.email "loopmaker-bot@users.noreply.github.com"
          git add 7-deploy/images.lock
          # `[skip ci]` — второй предохранитель: бот не должен каскадом будить другие
          # workflow, даже если фильтры путей когда-нибудь изменятся (@TL 09:41).
          git commit -m "bot: images.lock синхронизирован с git (lock-sync) [skip ci]"
          # main защищён (GH006: Protected branch update failed) — бот не пушит в main.
          # Вариант (б): ветка lock-sync/<sha> + PR (TL 15:50). Protection не трогаем.
          BR="lock-sync/$(git rev-parse --short HEAD)"
          git checkout -B "$BR"
          git push origin "HEAD:refs/heads/$BR"
          # PR создаём один раз (если для ветки уже есть открытый — не дублируем)
          if ! gh pr list --head "$BR" --state open --json number --jq '.[].number' | grep -q .; then
            gh pr create --base main --head "$BR" \
              --title "bot: images.lock синхронизирован (lock-sync)" \
              --body "Автоматический lock-sync: обновлён 7-deploy/images.lock (digest из реестра). Мерж — по обычному порядку."
          fi
          echo "lock-sync: ветка $BR запушена, PR открыт/существует"
          exit 0
