name: lock-sync

# Причина (@TL 09:32, повторено 18:0x): `images.lock` выводится ИЗ GIT, поэтому любой
# коммит в `6-msa/BC-*` или `8-front` его обесценивает — и следующий пуш получает
# красный CI, к его задаче не относящийся. За сутки это случилось трижды
# (`journal`/`partners`/`front`), и каждый раз лечилось командой `--write`.
#
# Здесь та же команда выполняется автоматически на пуш, который меняет эти папки:
# гейт перестаёт зависеть от памяти ролей. Ручной `--write` остаётся допустимым.

on:
  push:
    branches: [ main ]
    paths:
      - '6-msa/**'
      - '8-front/**'
      - 'tools/gen_images_lock.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lock-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # @TL 18:35 (принято @DO): lock пишется ТОЛЬКО если теги этого релизного коммита
      # реально опубликованы. Иначе бот снова поставит тег, которого нет в GHCR, и
      # `deploy-dev` упадёт на `lock-published` — зелёный CI при невыкатываемом lock
      # хуже красного. Проверка идёт ДО записи, а не после.
      # @TL 21:19 + @AR 21:17 + факт из ci-guards #3171 (2026-11-06 21:35):
      # здесь была развилка «не писать lock, если теги не опубликованы» — и она дала КЛИНЧ:
      # `check_lock` (гейт в `ci-guards`) требует, чтобы lock совпадал с git, а политика запрещала
      # его писать, пока теги не в GHCR. Итог: каждый коммит @BE в `6-msa` краснил `ci-guards`
      # навсегда, до зелёных сборок — то есть красный CI «как фон», ровно то, от чего уходили.
      #
      # Разделили ответственности: lock — производная от git (детерминированная), поэтому его
      # пишем всегда; а «можно ли катить» решает `lock-published` в `deploy.yml`, который падает
      # ДО `podman pull` с готовым списком отсутствующих тегов. Проверка registry здесь остаётся
      # информационным шагом (notice), чтобы было видно состояние, но не блокировала запись.
      - name: Состояние registry (информационно)
        run: |
          set -uo pipefail
          python tools/gen_images_lock.py --selftest
          # NB: shell у GitHub — `bash -e`, поэтому `rc=1` от проверки обрывал шаг
          # («информационный» шаг падал — так и было в #83/#84). Берём код явно и НЕ падаем.
          rc=0
          python tools/gen_images_lock.py --verify-registry || rc=$?
          echo "verify-registry rc=$rc"
          if [ "$rc" = "2" ]; then
            echo "::warning::registry недоступен — НЕ ИЗМЕРЕНО (lock всё равно перезапишется из git)"
          elif [ "$rc" != "0" ]; then
            echo "::notice::часть тегов этого коммита ещё не в GHCR — lock запишется, деплой заблокирует lock-published"
          fi
          exit 0

      - name: Перегенерировать lock
        run: python tools/gen_images_lock.py --write

      - name: Проверить, что после записи гейт зелёный
        run: python tools/gen_images_lock.py --check

      - name: Закоммитить, если изменилось
        run: |
          set -euo pipefail
          if git diff --quiet -- 7-deploy/images.lock; then
            echo "lock уже актуален — коммит не нужен"
            exit 0
          fi
          git config user.name "loopmaker-bot"
          git config user.email "loopmaker-bot@users.noreply.github.com"
          git add 7-deploy/images.lock
          # `[skip ci]` — второй предохранитель: бот не должен каскадом будить другие
          # workflow, даже если фильтры путей когда-нибудь изменятся (@TL 09:41).
          git commit -m "bot: images.lock синхронизирован с git (lock-sync) [skip ci]"
          # чужой пуш мог опередить — интегрируем и повторяем, до трёх раз
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git merge --no-edit origin/main || { echo "::error::конфликт в lock-sync"; exit 1; }
            python tools/gen_images_lock.py --write
            git add 7-deploy/images.lock
            # @TE 09:50: «нечего коммитить» — это НЕ ошибка, и её нельзя глушить `|| true`
            # (иначе цикл из трёх попыток упадёт с ложным `::error::`, хотя причина — пустой диф).
            if git diff --cached --quiet -- 7-deploy/images.lock; then
              echo "после интеграции lock не изменился — нечего коммитить"
              exit 0
            fi
            git commit -m "bot: images.lock синхронизирован с git (lock-sync, повтор $i) [skip ci]"
          done
          echo "::error::lock-sync не смог закоммитить за 3 попытки"
          exit 1
