name: Auto PR (role branch -> main)

on:
  push:
    branches:
      - 'role/**'
    # `paths: ['**']` — только чтобы пройти `check_workflow_paths` (он требует фильтр у
    # `on.push`): PR должен появляться на ЛЮБОЙ пуш ветки, поэтому шаблон «всё».
    # Долгосрочно: @LM вносит `pr-create.yml` в `ci.light_workflows` — тогда строка уходит.
    paths: ['**']

permissions:
  contents: read
  pull-requests: write
  # DO-119 ч.2 (@AR 03:40, @TL 03:41): PR, созданный `GITHUB_TOKEN`, НЕ запускает
  # workflow (анти-рекурсия GitHub) — без этого у авто-PR не было бы ни одного чека.
  actions: write

jobs:
  pr:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, 'chat(bot)') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create PR (если ещё нет)
        id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # PAT не годится: у него нет scope на PR
        run: |
          if gh pr view "$GITHUB_REF_NAME" --json number >/dev/null 2>&1; then
            echo "PR уже есть — чеки всё равно перезапускаем (@AR 03:43: dispatch обязан"
            echo "идти на КАЖДЫЙ пуш, иначе новый SHA остаётся без чеков)"
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          else
            gh pr create --base main --head "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME: $(git log -1 --pretty=%s)" \
              --body "Авто-PR из ветки \`$GITHUB_REF_NAME\` (PDR-047)."
            echo "has_pr=true" >> "$GITHUB_OUTPUT"
          fi
      # Событие от `GITHUB_TOKEN` не порождает прогонов — запускаем чеки сами.
      - name: Dispatch checks (иначе у авто-PR нет чеков)
        if: steps.create.outputs.has_pr == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          for wf in ci-guards.yml ci-backend.yml; do
            echo "::notice::dispatch $wf --ref $GITHUB_REF_NAME"
            gh workflow run "$wf" --ref "$GITHUB_REF_NAME" || echo "::warning::$wf: dispatch не удался"
          done
